name: Scan Git history for secrets
description: Verify the pinned Gitleaks binary and scan all checked-out refs.
runs:
  using: composite
  steps:
    - name: Install gitleaks (checksum verified)
      env:
        GITLEAKS_VERSION: '8.21.2'
        # Pinned here, not read from the release's own checksums file.
        GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -sSfL -o "$archive" "$base/$archive"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
        tar xzf "$archive" gitleaks
        ./gitleaks version

    - name: Scan every commit
      shell: bash
      run: |
        "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
          --log-opts="--all" --exit-code 1 .
