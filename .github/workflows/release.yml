name: Release

# Cuts a release from a version tag, and only from one: see docs/release.md.
# The build job builds every binary and the guest image twice and compares
# them, audits the dependencies, writes the SBOMs and scans them; it holds no
# token that can sign or write. It assembles the offline host distribution. The sign job signs the checksums with cosign
# (keyless, GitHub's OIDC identity) and attests their SLSA provenance. The
# publish job publishes the release directly (a tag with a suffix makes a
# prerelease). Both run in the "release" environment (S-16,
# docs/release.md#the-release-environment): the signing certificate names the
# environment, which install.sh, the CLI and the host helper require.
#
# A rehearsal (workflow_dispatch on a branch) runs the build and the native
# CLI tests under a pre-release tag created on the runner only, never pushed;
# it signs and publishes nothing. It checks a fix before a version is tagged.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Tag to rehearse, local to the runner, such as v0.0.1-rehearsal.1'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  GOENV: 'off'
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '1'
  # internal/volumestore links -l:libcryptsetup.so.12, which Go refuses in a
  # #cgo directive unless this pattern allows it.
  CGO_LDFLAGS_ALLOW: '-l:libcryptsetup\.so\.12'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal || github.ref_name }}

jobs:
  build:
    name: Build twice, audit, SBOMs and scans
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      checksum-index: ${{ steps.assets.outputs.checksum-index }}
    permissions:
      contents: read
      # Read the runtime images' provenance (scan-artifacts.py --verify-runtime-images).
      attestations: read
    steps:
      - name: Check out the tagged commit with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go, without any cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Check the tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 -c 'import re, sys; sys.exit(not re.fullmatch(r"v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", sys.argv[1]))' "$TAG"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A rehearsal: tag the branch head on this runner only (the
            # checkout keeps no credentials, so nothing can be pushed).
            case "$TAG" in *-rehearsal.*) ;; *) echo "a rehearsal tag must contain -rehearsal." >&2; exit 1 ;; esac
            git tag "$TAG" HEAD
            exit 0
          fi
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          # Only a commit of main is released.
          git merge-base --is-ancestor HEAD origin/main

      - name: Install native headers and the guest image's tools
        run: |
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb deb-src
          URIs: https://snapshot.ubuntu.com/ubuntu/20261113T000000Z
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
          # The runner image can also be newer than the snapshot (on
          # 2026-11-26 its libudev1 was, and libudev-dev could not install):
          # prefer the snapshot's versions, downgrades included. glibc is never
          # downgraded; the check below refuses a runner whose libc differs.
          sudo tee /etc/apt/preferences.d/agentcapsule-snapshot >/dev/null <<'EOF'
          Package: libc6 libc6-dev libc-bin libc-dev-bin locales
          Pin: origin snapshot.ubuntu.com
          Pin-Priority: 500

          Package: *
          Pin: origin snapshot.ubuntu.com
          Pin-Priority: 1001
          EOF
          sudo apt-get update
          # Bring the runner's packages to the snapshot's versions. The guest
          # image copies glibc, cryptsetup, e2fsprogs and their libraries from
          # this host, and the server bundle ships the snapshot's sources of
          # exactly those versions; the runner image can lag behind it.
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade --yes --allow-downgrades -o Dpkg::Options::=--force-confold
          sudo apt-get install --yes --allow-downgrades --no-install-recommends \
            build-essential libcryptsetup-dev cryptsetup-bin e2fsprogs musl-tools cmake pkg-config \
            bison flex libelf-dev libssl-dev bc xz-utils skopeo libseccomp-dev mmdebstrap
          libc="$(dpkg-query -W -f='${Version}' libc6)"
          test "$libc" = "$(apt-cache policy libc6 | awk '/Candidate:/ {print $2}')"

      - name: Dependency audit (govulncheck on every Go module, licenses)
        run: |
          # --release: a vulnerability the code calls blocks the release even
          # when allowlisted (ADR 013).
          python3 scripts/audit-dependencies.py --go "$(command -v go)" --release \
            --output "$RUNNER_TEMP/release/audit"

      - name: Build the binaries and the guest image twice, and compare
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 scripts/build-release.py --go "$(command -v go)" --version "$TAG" \
            --twice --fresh-module-cache --guest-cryptsetup /usr/sbin/cryptsetup \
            --output "$RUNNER_TEMP/release/build"

      - name: Build the patched VMM, guest kernel and server distribution
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-unknown-linux-musl
          python3 scripts/build-firecracker.py --output "$release/vmm" --target-dir "$RUNNER_TEMP/firecracker-target"
          rm -rf -- "$RUNNER_TEMP/firecracker-target"
          python3 scripts/build-guest-kernel.py --output "$release/kernel"
          rm -rf -- "$release/kernel/source" "$release/kernel/build"
          python3 scripts/build-server-bundle.py --build "$release/build" --out "$release/assets" \
            --vmm "$release/vmm" --kernel "$release/kernel" --licenses "$release/audit/third-party-licenses.txt"

      - name: SBOMs
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/release/build/dist"
          binaries=()
          for name in agentcapsule-api agentcapsule-worker agentcapsule-admin agentcapsule-authority \
              agentcapsule-harness capsule-adapter agentcapsule-slim-bridge agentcapsule-worker-helper; do
            binaries+=(--binary "$dist/$name")
          done
          for cli in "$dist"/agentcapsule-{linux,darwin,windows}-*; do binaries+=(--binary "$cli"); done
          for harness in python adapted; do
            python3 "scripts/build-$harness-harness.py" --output "$RUNNER_TEMP/release/harness-$harness"
          done
          python3 scripts/release-sbom.py --go "$(command -v go)" --version "$TAG" \
            --output "$RUNNER_TEMP/release/sbom" "${binaries[@]}" --guest-build "$dist" \
            --harness-package "$RUNNER_TEMP/release/harness-python/package" \
            --harness-package "$RUNNER_TEMP/release/harness-adapted/package" \
            --host-assets "$RUNNER_TEMP/release/assets"

      - name: Vulnerability scan (SBOMs and deploy images) and the runtime images' provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          syft="$(python3 scripts/release_tools.py syft | awk '{print $3}')"
          "$syft" scan "file:$release/vmm/Cargo.lock" --source-name firecracker-Cargo.lock -o "spdx-json=$release/sbom/firecracker-Cargo.lock.spdx.json"
          python3 scripts/release_oci.py --assets "$release/assets" --sboms "$release/sbom"
          sboms=("$RUNNER_TEMP"/release/sbom/*.spdx.json)
          python3 scripts/scan-artifacts.py --output "$RUNNER_TEMP/release/scan" \
            "${sboms[@]/#/--sbom=}" --offline-image-index "$release/assets/component-sources.json" --deploy-images \
            --verify-runtime-images

      - name: Assemble the release files and their checksums
        id: assets
        run: |
          # Include the corresponding sources and notices alongside the server bundle.
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          assets="$release/assets"
          cp "$release"/build/dist/agentcapsule-{linux,darwin,windows}-* "$assets"/
          # The `curl | sh` installer of the workstation CLI, signed with the rest.
          install -m 0644 install.sh "$assets/install.sh"
          cp "$release"/sbom/*.spdx.json "$assets"/
          for name in agentcapsule-api agentcapsule-worker agentcapsule-admin agentcapsule-authority \
              agentcapsule-harness agentcapsule-slim-bridge agentcapsule-worker-helper; do
            cp "$release/build/dist/$name" "$release/sbom/$name.spdx.json" "$assets"/
          done
          verifier="$(python3 scripts/release_tools.py cosign | awk '{print $3}')"
          cp "$verifier" "$assets/cosign-linux-amd64"
          cp "$release/build/build.json" "$assets/build.json"
          cp "$release/audit/third-party-licenses.txt" "$release/audit/licenses.json" "$assets"/
          cp "$release/audit/summary.json" "$assets/dependency-audit.json"
          cp "$release/scan/summary.json" "$assets/vulnerability-scan.json"
          cp deploy/images/openssl/qualification.json "$assets/openssl-qualification.json"
          # Ship the CLI cheat sheet and any formal evidence prepared for this tag.
          install -m 0644 docs/cli-cheatsheet.pdf "$assets/cli-cheatsheet.pdf"
          release_docs="docs/releases/$RELEASE_TAG"
          for file in formal-summary.json p1-certificate.json p1-replay.json \
              p1-tlc-verdicts.json p1-wrappers.json p2-certificate.json; do
            if [[ -f "$release_docs/$file" ]]; then
              install -m 0644 "$release_docs/$file" "$assets/$file"
            fi
          done
          tar -C "$release/scan" -czf "$assets/vulnerability-reports.tar.gz" .
          cd "$assets"
          # GitHub accepts at most 1000 files, each strictly below 2 GiB.
          # Reserve three entries for SHA256SUMS and the two Sigstore bundles.
          python3 - <<'PYTHON'
          from pathlib import Path
          files = list(Path(".").iterdir())
          if len(files) + 3 > 1000:
              raise SystemExit("Too many GitHub release files")
          for file in files:
              if file.name.startswith(".") or not file.is_file() or file.is_symlink() or file.stat().st_size >= 2**31:
                  raise SystemExit(f"Invalid or oversized release asset: {file.name}")
          PYTHON
          LC_ALL=C sha256sum -- * > "$release/SHA256SUMS"
          mv "$release/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          echo "checksum-index=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep the logs of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/release/**/*.log
            ${{ runner.temp }}/release/**/summary.json

      - name: Keep the six release binaries and the index for native execution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-release-files
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release/assets/SHA256SUMS
            ${{ runner.temp }}/release/assets/agentcapsule-linux-amd64
            ${{ runner.temp }}/release/assets/agentcapsule-linux-arm64
            ${{ runner.temp }}/release/assets/agentcapsule-darwin-amd64
            ${{ runner.temp }}/release/assets/agentcapsule-darwin-arm64
            ${{ runner.temp }}/release/assets/agentcapsule-windows-amd64.exe
            ${{ runner.temp }}/release/assets/agentcapsule-windows-arm64.exe

      - name: Keep the release files for the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/release/assets/

  native-cli:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/cli-native.yml
    with:
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal || github.ref_name }}
      checksum-index: ${{ needs.build.outputs.checksum-index }}

  sign:
    name: Sign the checksums and attest the provenance
    needs: [build, native-cli]
    if: github.event_name == 'push'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out sources (the pinned tool list)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/assets

      - name: Check every file against SHA256SUMS
        env:
          NATIVE_CHECKSUM_INDEX: ${{ needs.build.outputs.checksum-index }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          test "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$NATIVE_CHECKSUM_INDEX"
          sha256sum --strict -c SHA256SUMS
          # Nothing that the checksums do not cover.
          present="$(for f in *; do [ "$f" = SHA256SUMS ] || printf '%s\n' "$f"; done | sort)"
          test "$present" = "$(awk '{print $2}' SHA256SUMS | sort)"

      - name: Sign SHA256SUMS with cosign (keyless) and verify the signature
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign="$(python3 scripts/release_tools.py cosign | awk '{print $3}')"
          cd "$RUNNER_TEMP/assets"
          "$cosign" sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          "$cosign" verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$REF" SHA256SUMS

      - name: Install the CLI as users do, which checks the signer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # install.sh verifies the signature with the same claims, and that the
          # certificate names the release environment, from a local copy of
          # the release laid out as GitHub serves it.
          cosign="$(python3 scripts/release_tools.py cosign | awk '{print $3}')"
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/served/download" "$RUNNER_TEMP/cli"
          ln -s "$cosign" "$RUNNER_TEMP/tools/cosign"
          ln -s "$RUNNER_TEMP/assets" "$RUNNER_TEMP/served/download/$TAG"
          python3 -m http.server --bind 127.0.0.1 --directory "$RUNNER_TEMP/served" 18080 >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 50); do curl -fsS -o /dev/null "http://127.0.0.1:18080/download/$TAG/SHA256SUMS" && break; sleep 0.2; done
          PATH="$RUNNER_TEMP/tools:$PATH" AGENTCAPSULE_RELEASE_BASE_URL=http://127.0.0.1:18080 \
            sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/cli" </dev/null

      - name: Attest the SLSA build provenance of every file
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS

      - name: Keep the signature and the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/signatures"
          cp "$RUNNER_TEMP/assets/SHA256SUMS.sigstore.json" "$RUNNER_TEMP/signatures/"
          cp "$BUNDLE" "$RUNNER_TEMP/signatures/provenance.sigstore.json"

      - name: Upload the signature and the provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/signatures/

  publish:
    name: Publish the release
    needs: [build, sign]
    if: github.event_name == 'push'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/assets

      - name: Fetch the signature and the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: ${{ runner.temp }}/assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          sha256sum --strict -c SHA256SUMS
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Agent Capsule $TAG, built from $GITHUB_SHA.

          Install the workstation CLI on Linux or macOS (or Git Bash on Windows):

              curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh -s -- --version $TAG

          The script needs cosign: it verifies that SHA256SUMS was signed by this
          release's workflow in the protected release environment, then checks the
          executable against SHA256SUMS. Then run \`agentcapsule install --help\`.

          [Download and verify the workstation CLI by hand](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/release.md#verify-a-release).
          [Install the matching server bundle](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/cli-host.md).

          The dependency audit and the vulnerability scan of this release are
          dependency-audit.json and vulnerability-scan.json; findings accepted by
          scripts/vulnerability-allowlist.json are listed there with their reason.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${prerelease[@]}" --title "Agent Capsule $TAG" --notes-file "$RUNNER_TEMP/notes.md" -- ./*
