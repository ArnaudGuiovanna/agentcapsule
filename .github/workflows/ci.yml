name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  GOENV: 'off'
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '1'
  # internal/volumestore links -l:libcryptsetup.so.12, which Go refuses in a
  # #cgo directive unless this pattern allows it.
  CGO_LDFLAGS_ALLOW: '-l:libcryptsetup\.so\.12'

jobs:
  cli:
    uses: ./.github/workflows/cli-native.yml

  checks:
    name: Format, vet, contracts and models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install native headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libcryptsetup-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal sdk/go)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: go vet (default, KVM and live-LLM build tags)
        run: |
          go vet ./...
          go vet -tags=kvm_integration,kvm_control_integration,kvm_product_integration ./internal/worker ./internal/runtime
          go vet -tags=llmlive ./internal/llmgateway ./internal/controlplane

      - name: go vet without cgo (the packages the interop job and the harness builds compile without it)
        env:
          CGO_ENABLED: '0'
        run: go vet -tags=interop_services ./internal/directory ./cmd/agentcapsule-harness ./examples/a2a-agent

      - name: Read one mounted corpus from Go, Python and MCP
        run: go test -race -tags sqlite_fts5 -count=1 ./sdk/go/corpus

      - name: Authorization matrix (every route has a row, docs/api/rbac.md matches it)
        run: go test -count=1 -run '^TestRBACMatrix(IsWellFormed|CoversEveryRoute|IsDocumented)$' ./internal/api

      - name: Script unit tests (the check runner, the textfile scripts, the archive shipper, the backup tools' fetch, the release build scripts)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Repository hygiene (no personal paths, no committed evidence sources)
        run: python3 scripts/check-repo-hygiene.py

      - name: Vulnerability allowlist (a warning 21 days before an entry expires, a failure once it has)
        run: python3 scripts/release_tools.py --check-allowlist

      - name: Alert rules (promtool check and unit tests, metrics registered by the code)
        run: |
          # Prometheus v3.5.0, pinned by digest.
          python3 scripts/verify-alerts.py \
            --promtool-image prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

      - name: Validate the OpenAPI 3.1 contract
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi"
          "$RUNNER_TEMP/openapi/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/openapi-requirements.txt
          "$RUNNER_TEMP/openapi/bin/python" -m openapi_spec_validator --schema 3.1 openapi/openapi.yaml

      - name: Typecheck the Quint models
        working-directory: spec
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

  models:
    name: Model runs and the fixtures' schedules on the current models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Quint
        working-directory: spec
        run: npm ci --no-audit --no-fund

      - name: Run every run of the models, replay every ITF schedule on its current model (TypeScript evaluator, no download)
        run: python3 scripts/check-model-runs.py --jobs 4

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: ./.github/actions/scan-secrets

  release-audit:
    name: Release audit (dependencies, reproducible build, SBOMs, scans)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: |
            go.sum
            runtime/slimbridge/go.sum
            scripts/tools/go.sum

      - name: Install native headers and the guest image's tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcryptsetup-dev cryptsetup-bin e2fsprogs

      - name: Lint the workflows (actionlint and shellcheck, pinned)
        run: |
          set -euo pipefail
          actionlint="$(python3 scripts/release_tools.py actionlint | awk '{print $3}')"
          # The workflows' scripts are checked by ShellCheck v0.11.0, pinned by
          # digest; the runner's own ShellCheck and pyflakes are not pinned.
          printf '#!/bin/sh\nexec docker run --rm -i --network none %s "$@"\n' \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            > "$RUNNER_TEMP/shellcheck"
          chmod +x "$RUNNER_TEMP/shellcheck"
          "$actionlint" -shellcheck="$RUNNER_TEMP/shellcheck" -pyflakes= -color
          # The CLI installer runs under any POSIX sh (curl | sh).
          "$RUNNER_TEMP/shellcheck" --shell=sh - < install.sh

      - name: Dependency audit (govulncheck on every Go module, licenses)
        run: |
          # Fails on a vulnerability the code calls, or a license outside
          # scripts/license-policy.json; see docs/release.md.
          python3 scripts/audit-dependencies.py --go "$(command -v go)" \
            --output "$RUNNER_TEMP/ci/audit"

      - name: Build the release binaries and the guest image twice, and compare
        run: |
          python3 scripts/build-release.py --go "$(command -v go)" --twice \
            --guest-cryptsetup /usr/sbin/cryptsetup --output "$RUNNER_TEMP/ci/release"

      - name: Build the a2a-agent harness package (no Docker)
        run: |
          python3 scripts/build-a2a-harness.py --go "$(command -v go)" \
            --output "$RUNNER_TEMP/ci/a2a-harness"

      - name: SBOMs of the binaries, the guest image and the a2a-agent package
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/ci/release/dist"
          binaries=()
          for name in agentcapsule-api agentcapsule-worker agentcapsule-admin agentcapsule-authority \
              agentcapsule-harness capsule-adapter agentcapsule-slim-bridge agentcapsule-worker-helper; do
            binaries+=(--binary "$dist/$name")
          done
          for cli in "$dist"/agentcapsule-{linux,darwin,windows}-*; do binaries+=(--binary "$cli"); done
          python3 scripts/release-sbom.py --go "$(command -v go)" --output "$RUNNER_TEMP/ci/sbom" \
            "${binaries[@]}" --guest-build "$dist" \
            --harness-package "$RUNNER_TEMP/ci/a2a-harness/package"

      - name: Vulnerability scan (SBOMs, deploy images, Python and npm lock files)
        run: |
          set -euo pipefail
          sboms=("$RUNNER_TEMP"/ci/sbom/*.spdx.json)
          python3 scripts/scan-artifacts.py --output "$RUNNER_TEMP/ci/scan" \
            "${sboms[@]/#/--sbom=}" --deploy-images \
            --manifest examples/adapted-agent/requirements.txt \
            --dev-manifest spec/package-lock.json \
            --dev-manifest scripts/openapi-requirements.txt \
            --dev-manifest scripts/adapter-sdk-requirements.txt

      - name: Preserve the audit reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci/audit/summary.json
            ${{ runner.temp }}/ci/audit/licenses.json
            ${{ runner.temp }}/ci/release/build.json
            ${{ runner.temp }}/ci/sbom/
            ${{ runner.temp }}/ci/scan/summary.json

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job audits the dependencies (govulncheck, licenses), builds the release
          binaries and the guest image twice in clean clones and compares their digests,
          writes their SBOMs and scans them and the deploy images. Both builds run on this
          runner: the digests are reproducible with the same Go and the same Ubuntu
          packages, not across hosts. It signs nothing and publishes nothing: the release
          workflow (.github/workflows/release.yml) does, on a version tag only.
          EOF

  harness-supply-chain:
    name: Harness packages (Dagger), signing and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAGGER_VERSION: '0.21.11'
      DAGGER_SHA256: a2d3ef96e7305abc18663a3606d9c1c592278ba3c8f48e01d6be14eef72276ef
      DO_NOT_TRACK: '1'
      DAGGER_NO_NAG: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dagger (checksum verified)
        run: |
          set -euo pipefail
          archive="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archive" "https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/${archive}"
          echo "${DAGGER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" dagger
          ./dagger version

      - name: Build, publish, sign and verify the reference harnesses
        run: |
          # Builds python-echo and go-echo from pinned images, pushes them to a
          # throwaway registry, checks that an unsigned package is refused,
          # signs both and verifies them as the platform importer would.
          "$RUNNER_TEMP/dagger" call check

      - name: SBOMs and vulnerability scan of the reference harness packages
        run: |
          # The packages the check just built (Dagger's cache), unpacked with
          # debugfs and cataloged by the pinned syft, then scanned by the
          # pinned grype: High and Critical findings fail unless allowlisted
          # (scripts/vulnerability-allowlist.json). See docs/release.md.
          set -euo pipefail
          for name in python-echo go-echo adapted-agent; do
            "$RUNNER_TEMP/dagger" call "$name" export --path "$RUNNER_TEMP/packages/$name"
          done
          python3 scripts/release-sbom.py --output "$RUNNER_TEMP/ci/harness-sbom" \
            --harness-package "$RUNNER_TEMP/packages/python-echo" \
            --harness-package "$RUNNER_TEMP/packages/go-echo" \
            --harness-package "$RUNNER_TEMP/packages/adapted-agent"
          sboms=("$RUNNER_TEMP"/ci/harness-sbom/*.spdx.json)
          python3 scripts/scan-artifacts.py --output "$RUNNER_TEMP/ci/harness-scan" \
            "${sboms[@]/#/--sbom=}"

      - name: Preserve the harness SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci/harness-sbom/
            ${{ runner.temp }}/ci/harness-scan/summary.json

  interop:
    name: Interoperability services (OASF, Directory, SLIM, A2A)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: |
            runtime/interop/probe/go.sum
            runtime/interop/a2aslim/go.sum
            runtime/slimbridge/go.sum

      - name: Qualify the pinned profile against its private services
        run: |
          # Starts deploy/interop from pinned images with lab certificates, then
          # publishes, searches and validates OASF records in Directory, checks
          # refused identities, exchanges messages through the SLIM node and
          # runs A2A over SLIM. Removes the services afterwards. Also checks the
          # systemd units of deploy/systemd without running them (the runner
          # has no systemd user manager for the supervision checks).
          python3 scripts/verify-interop.py --go "$(command -v go)" --services \
            --systemd static --output "$RUNNER_TEMP/ci/interop"

      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ci/interop/

  go-postgres:
    name: Go race, PostgreSQL and WAL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install native and database dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcryptsetup-dev postgresql-16 postgresql-client-16 iproute2 nftables

      - name: Allow unprivileged user namespaces
        run: |
          # TestWorkerFlowsDialOnlyTheirConfiguredEndpoints runs the worker's
          # flows in a network namespace of their own (unshare -rn, DEP-1).
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Real PostgreSQL, Go race and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          postgres_executable="$(dpkg-query -L postgresql-16 | awk '/\/bin\/postgres$/ {print; exit}')"
          test -x "$postgres_executable"
          mkdir -p "$RUNNER_TEMP/ci"
          {
            go version
            python3 --version
            cc --version
            dpkg-query -W postgresql-16 postgresql-client-16 libcryptsetup-dev
            uname -a
          } > "$RUNNER_TEMP/ci/toolchain.log"
          python3 scripts/verify-postgres.py \
            --pg-bin "$(dirname "$postgres_executable")" \
            --native-tools / \
            --output "$RUNNER_TEMP/ci/postgres"

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci/toolchain.log
            ${{ runner.temp }}/ci/postgres/summary.json
            ${{ runner.temp }}/ci/postgres/environment.json
            ${{ runner.temp }}/ci/postgres/*.jsonl
            ${{ runner.temp }}/ci/postgres/*.log

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job runs the Go packages with the race detector against real SQLite and
          PostgreSQL, including process crashes and PostgreSQL WAL recovery. It does
          not run KVM, jailed Firecracker VMs, live LLM providers or restore on a
          second host: those campaigns are in
          scripts/ and must be run on a KVM host (see scripts/README.md).
          EOF

  backups:
    name: Backups (WAL archiving, standby, archive shipping, failover)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential postgresql-16 postgresql-client-16
          postgres_executable="$(dpkg-query -L postgresql-16 | awk '/\/bin\/postgres$/ {print; exit}')"
          test -x "$postgres_executable"
          echo "PG_BIN=$(dirname "$postgres_executable")" >> "$GITHUB_ENV"

      - name: Fetch pgBackRest 2.50 and rclone 1.60.1 (SHA-256 checked)
        id: tools
        run: |
          # The server bundle's pgBackRest (Ubuntu 24.04's) and Ubuntu 26.04's
          # rclone, from the bundle's snapshot of the Ubuntu archive, checked
          # against the SHA-256s written in the script and extracted with
          # dpkg-deb, without apt.
          python3 scripts/fetch-backup-tools.py --output "$RUNNER_TEMP/backup-tools"

      - name: Record the toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci"
          {
            go version
            python3 --version
            dpkg-query -W postgresql-16 postgresql-client-16 libpq5
            docker version --format 'Docker {{.Server.Version}}'
            systemd-analyze --version | head -n 1
            uname -a
            cat "$RUNNER_TEMP/backup-tools/packages.json"
          } > "$RUNNER_TEMP/ci/backup-toolchain.log"

      - name: WAL archiving, restores, the standby and its promotion
        timeout-minutes: 15
        run: |
          # pgBackRest to S3 (SeaweedFS) and SFTP (OpenSSH), both pinned by
          # digest; about 7 minutes. See docs/recovery.md, "Qualify".
          python3 scripts/verify-backups.py --pg-bin "$PG_BIN" \
            --pgbackrest "$RUNNER_TEMP/backup-tools/pgbackrest/usr/bin/pgbackrest" \
            --output "$RUNNER_TEMP/ci/backups"

      - name: Volume archive shipping and the standby's replay
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          # rclone to the same two stores, archives captured by the platform's
          # code, then the replay metric on a real standby and the systemd
          # units; about 7 minutes. See docs/recovery.md, "Qualify the shipping".
          python3 scripts/verify-archive-shipping.py \
            --rclone "$RUNNER_TEMP/backup-tools/rclone/usr/bin/rclone" \
            --go "$(command -v go)" --pg-bin "$PG_BIN" \
            --output "$RUNNER_TEMP/ci/archive-shipping"

      - name: Failover of the database and the API (RTO and RPO)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          # The same stores; the primary runs agentcapsule-api, built from
          # the sources, under a client that writes steadily; the standby
          # replays. The primary is killed, then the failover is timed from
          # the decision to the first write on the standby; about 3 minutes.
          # See docs/recovery.md, "Qualify the failover".
          python3 scripts/verify-failover.py --pg-bin "$PG_BIN" \
            --pgbackrest "$RUNNER_TEMP/backup-tools/pgbackrest/usr/bin/pgbackrest" \
            --go "$(command -v go)" --output "$RUNNER_TEMP/ci/failover"

      - name: Keep only the evidence that holds no secret
        if: always()
        run: |
          # Each run searches its evidence for every secret it generated and
          # writes what it found in summary.json. Keep a run's evidence only
          # when that search ran and found nothing, and no file holds a
          # private key. Without summary.json, nothing proves it: drop it.
          python3 - "$RUNNER_TEMP/ci" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          ci = Path(sys.argv[1])
          keep = ci / "upload"
          keep.mkdir(parents=True, exist_ok=True)
          for name in ("backups", "archive-shipping", "failover"):
              evidence = ci / name
              summary = evidence / "summary.json"
              if not summary.is_file():
                  print(f"{name}: no summary.json, not kept")
                  continue
              leaks = json.loads(summary.read_text()).get("secrets_in_evidence")
              keys = [str(f.relative_to(evidence)) for f in evidence.rglob("*")
                      if f.is_file() and b"PRIVATE KEY" in f.read_bytes()]
              if leaks != [] or keys:
                  print(f"{name}: secrets in {leaks}, private keys in {keys}: not kept")
                  continue
              shutil.copytree(evidence, keep / name)
              print(f"{name}: no secret found, kept")
          toolchain = ci / "backup-toolchain.log"
          if toolchain.is_file():
              shutil.copy2(toolchain, keep / toolchain.name)
          PY

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backups-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ci/upload/

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job runs scripts/verify-backups.py, scripts/verify-archive-shipping.py
          and scripts/verify-failover.py with pgBackRest 2.58 and rclone 1.60.1, Ubuntu
          26.04's packages. PostgreSQL is 16, Ubuntu 24.04's: Ubuntu 26.04's PostgreSQL
          18 needs a newer glibc than the runner's. SeaweedFS stands for the S3
          provider, without object lock. The failover of the database and the API runs
          on one machine, with archive_timeout scaled to 30 seconds; no failover between
          real hosts is run, and the agents are not part of it (D-05, KVM).
          EOF

  install:
    name: Install from scratch (bootstrap.md and install.md, without root)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install native and database dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcryptsetup-dev postgresql-16 postgresql-client-16 iproute2 nftables
          postgres_executable="$(dpkg-query -L postgresql-16 | awk '/\/bin\/postgres$/ {print; exit}')"
          test -x "$postgres_executable"
          echo "PG_BIN=$(dirname "$postgres_executable")" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu 24.04 restricts them with AppArmor. The run starts the
          # worker's preflight and the authority service in a user namespace
          # where its account is root (unshare -r), and runs in a network
          # namespace of its own (unshare -rn, DEP-1); see verify-install.py.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install from scratch, then sign in as the organization's owner
        run: |
          python3 scripts/verify-install.py --go "$(command -v go)" --pg-bin "$PG_BIN" \
            --output "$RUNNER_TEMP/ci/install"

      - name: Preserve the install's evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ci/install/

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job builds every binary and installs a host from an empty directory as
          docs/bootstrap.md and docs/install.md say, without root: PostgreSQL, the
          migration, the platform credential, the API over HTTPS, an organization with
          its trust, the authority service (standalone) and the worker's preflight. It
          starts no VM: the runner gives no KVM device to this account, and no
          Firecracker, guest kernel or guest image is built, so the preflight reports
          those checks as failed and the worker refuses to start. The Directory and
          the SLIM node (Docker) and the authorities' replica are not installed.
          EOF
