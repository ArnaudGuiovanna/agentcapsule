name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  GOENV: 'off'
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '1'

jobs:
  checks:
    name: Format, vet, contracts and models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install native headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libcryptsetup-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: go vet (default, KVM and live-LLM build tags)
        run: |
          go vet ./...
          go vet -tags=kvm_integration,kvm_control_integration,kvm_product_integration ./internal/worker ./internal/runtime
          go vet -tags=llmlive ./internal/llmgateway ./internal/controlplane

      - name: Script unit tests (the check runner, the textfile scripts, the archive shipper, the backup tools' fetch)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Repository hygiene (no personal paths, no committed evidence sources)
        run: python3 scripts/check-repo-hygiene.py

      - name: Alert rules (promtool check and unit tests, metrics registered by the code)
        run: |
          # Prometheus v3.5.0, pinned by digest.
          python3 scripts/verify-alerts.py \
            --promtool-image prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

      - name: Validate the OpenAPI 3.1 contract
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi"
          "$RUNNER_TEMP/openapi/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/openapi-requirements.txt
          "$RUNNER_TEMP/openapi/bin/python" -m openapi_spec_validator --schema 3.1 openapi/openapi.yaml

      - name: Typecheck the Quint models
        working-directory: spec
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --log-opts="--all" --exit-code 1 .

  harness-supply-chain:
    name: Harness packages (Dagger), signing and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAGGER_VERSION: '0.21.11'
      DAGGER_SHA256: a2d3ef96e7305abc18663a3606d9c1c592278ba3c8f48e01d6be14eef72276ef
      DO_NOT_TRACK: '1'
      DAGGER_NO_NAG: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dagger (checksum verified)
        run: |
          set -euo pipefail
          archive="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archive" "https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/${archive}"
          echo "${DAGGER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" dagger
          ./dagger version

      - name: Build, publish, sign and verify the reference harnesses
        run: |
          # Builds python-echo and go-echo from pinned images, pushes them to a
          # throwaway registry, checks that an unsigned package is refused,
          # signs both and verifies them as the platform importer would.
          "$RUNNER_TEMP/dagger" call check

  interop:
    name: Interoperability services (OASF, Directory, SLIM, A2A)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: |
            runtime/interop/probe/go.sum
            runtime/interop/a2aslim/go.sum
            runtime/slimbridge/go.sum

      - name: Qualify the pinned profile against its private services
        run: |
          # Starts deploy/interop from pinned images with lab certificates, then
          # publishes, searches and validates OASF records in Directory, checks
          # refused identities, exchanges messages through the SLIM node and
          # runs A2A over SLIM. Removes the services afterwards. Also checks the
          # systemd units of deploy/systemd without running them (the runner
          # has no systemd user manager for the supervision checks).
          python3 scripts/verify-interop.py --go "$(command -v go)" --services \
            --systemd static --output "$RUNNER_TEMP/ci/interop"

      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ci/interop/

  go-postgres:
    name: Go race, PostgreSQL and WAL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install native and database dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcryptsetup-dev postgresql-16 postgresql-client-16

      - name: Real PostgreSQL, Go race and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          postgres_executable="$(dpkg-query -L postgresql-16 | awk '/\/bin\/postgres$/ {print; exit}')"
          test -x "$postgres_executable"
          mkdir -p "$RUNNER_TEMP/ci"
          {
            go version
            python3 --version
            cc --version
            dpkg-query -W postgresql-16 postgresql-client-16 libcryptsetup-dev
            uname -a
          } > "$RUNNER_TEMP/ci/toolchain.log"
          python3 scripts/verify-postgres.py \
            --pg-bin "$(dirname "$postgres_executable")" \
            --native-tools / \
            --output "$RUNNER_TEMP/ci/postgres"

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci/toolchain.log
            ${{ runner.temp }}/ci/postgres/summary.json
            ${{ runner.temp }}/ci/postgres/environment.json
            ${{ runner.temp }}/ci/postgres/*.jsonl
            ${{ runner.temp }}/ci/postgres/*.log

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job runs the Go packages with the race detector against real SQLite and
          PostgreSQL, including process crashes and PostgreSQL WAL recovery. It does
          not run KVM, jailed Firecracker VMs, live LLM providers or restore on a
          second host: those campaigns are in
          scripts/ and must be run on a KVM host (see scripts/README.md).
          EOF

  backups:
    name: Backups (WAL archiving, standby, archive shipping, failover)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential postgresql-16 postgresql-client-16
          postgres_executable="$(dpkg-query -L postgresql-16 | awk '/\/bin\/postgres$/ {print; exit}')"
          test -x "$postgres_executable"
          echo "PG_BIN=$(dirname "$postgres_executable")" >> "$GITHUB_ENV"

      - name: Fetch pgBackRest 2.58 and rclone 1.60.1 (SHA-256 checked)
        id: tools
        run: |
          # Ubuntu 26.04's exact packages, from a fixed snapshot of the Ubuntu
          # archive, checked against the SHA-256s written in the script and
          # extracted with dpkg-deb, without apt. Ubuntu 24.04's are older.
          python3 scripts/fetch-backup-tools.py --output "$RUNNER_TEMP/backup-tools"

      - name: Record the toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci"
          {
            go version
            python3 --version
            dpkg-query -W postgresql-16 postgresql-client-16 libpq5
            docker version --format 'Docker {{.Server.Version}}'
            systemd-analyze --version | head -n 1
            uname -a
            cat "$RUNNER_TEMP/backup-tools/packages.json"
          } > "$RUNNER_TEMP/ci/backup-toolchain.log"

      - name: WAL archiving, restores, the standby and its promotion
        timeout-minutes: 15
        run: |
          # pgBackRest to S3 (SeaweedFS) and SFTP (OpenSSH), both pinned by
          # digest; about 7 minutes. See docs/recovery.md, "Qualify".
          python3 scripts/verify-backups.py --pg-bin "$PG_BIN" \
            --pgbackrest "$RUNNER_TEMP/backup-tools/pgbackrest/usr/bin/pgbackrest" \
            --output "$RUNNER_TEMP/ci/backups"

      - name: Volume archive shipping and the standby's replay
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          # rclone to the same two stores, archives captured by the platform's
          # code, then the replay metric on a real standby and the systemd
          # units; about 7 minutes. See docs/recovery.md, "Qualify the shipping".
          python3 scripts/verify-archive-shipping.py \
            --rclone "$RUNNER_TEMP/backup-tools/rclone/usr/bin/rclone" \
            --go "$(command -v go)" --pg-bin "$PG_BIN" \
            --output "$RUNNER_TEMP/ci/archive-shipping"

      - name: Failover of the database and the API (RTO and RPO)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          # The same stores; the primary runs agentcapsule-api, built from
          # the sources, under a client that writes steadily; the standby
          # replays. The primary is killed, then the failover is timed from
          # the decision to the first write on the standby; about 3 minutes.
          # See docs/recovery.md, "Qualify the failover".
          python3 scripts/verify-failover.py --pg-bin "$PG_BIN" \
            --pgbackrest "$RUNNER_TEMP/backup-tools/pgbackrest/usr/bin/pgbackrest" \
            --go "$(command -v go)" --output "$RUNNER_TEMP/ci/failover"

      - name: Keep only the evidence that holds no secret
        if: always()
        run: |
          # Each run searches its evidence for every secret it generated and
          # writes what it found in summary.json. Keep a run's evidence only
          # when that search ran and found nothing, and no file holds a
          # private key. Without summary.json, nothing proves it: drop it.
          python3 - "$RUNNER_TEMP/ci" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          ci = Path(sys.argv[1])
          keep = ci / "upload"
          keep.mkdir(parents=True, exist_ok=True)
          for name in ("backups", "archive-shipping", "failover"):
              evidence = ci / name
              summary = evidence / "summary.json"
              if not summary.is_file():
                  print(f"{name}: no summary.json, not kept")
                  continue
              leaks = json.loads(summary.read_text()).get("secrets_in_evidence")
              keys = [str(f.relative_to(evidence)) for f in evidence.rglob("*")
                      if f.is_file() and b"PRIVATE KEY" in f.read_bytes()]
              if leaks != [] or keys:
                  print(f"{name}: secrets in {leaks}, private keys in {keys}: not kept")
                  continue
              shutil.copytree(evidence, keep / name)
              print(f"{name}: no secret found, kept")
          toolchain = ci / "backup-toolchain.log"
          if toolchain.is_file():
              shutil.copy2(toolchain, keep / toolchain.name)
          PY

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backups-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/ci/upload/

      - name: State what this job does not validate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job runs scripts/verify-backups.py, scripts/verify-archive-shipping.py
          and scripts/verify-failover.py with pgBackRest 2.58 and rclone 1.60.1, Ubuntu
          26.04's packages. PostgreSQL is 16, Ubuntu 24.04's: Ubuntu 26.04's PostgreSQL
          18 needs a newer glibc than the runner's. SeaweedFS stands for the S3
          provider, without object lock. The failover of the database and the API runs
          on one machine, with archive_timeout scaled to 30 seconds; no failover between
          real hosts is run, and the agents are not part of it (D-05, KVM).
          EOF
