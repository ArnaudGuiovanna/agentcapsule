openapi: 3.1.0
# DRAFT, NOT SERVED. ADR 023 (docs/adr/023-corpora.md), corpus lot 0.
#
# The served contract is openapi/openapi.yaml, which must describe exactly the
# routes agentcapsule-api serves (TestOpenAPIDescribesExactlyTheServedRoutes).
# These routes are not served yet, so they live here. Corpus lot 3 moves the
# source-credential paths, and lot 6 every other path, into
# openapi/openapi.yaml as it serves them, together with:
#   - their schemas, into components.schemas;
#   - their rows in docs/api/rbac.md and TestRBACMatrix, and each mutation in
#     auditedRoutes (internal/api/refusals.go);
#   - POST /v1/corpora/{id}/builds in the asynchronous routes
#     (TestAsynchronousRoutesAreListed, TestOpenAPIDocumentsTheAsynchronousRoutes);
#   - the new problem codes in problemCodes (internal/api/telemetry.go).
# The changes to existing schemas are at the end (x-changes-to-served-schemas):
# lot 2 applies the LLM alias ones, lot 4 the system image one, lot 6 the
# template and quota ones. Then this file is deleted.
info:
  title: Agent Capsule API — corpora (draft)
  version: 0.0.0-draft
  description: >-
    Draft of the corpus routes of ADR 023: source credentials, corpora,
    builds, releases and agents' corpus bindings. Every lookup is limited to
    the caller's organization; another organization's identifier answers 404.
    Scopes: corpus:manage (org_owner, org_admin) and corpus:read (org_owner,
    org_admin, agent_operator, auditor). Every mutation needs an
    Idempotency-Key.
servers:
  - url: https://api.example.invalid
security:
  - delegatedBearer: []
  - serviceBearer: []
paths:
  /v1/source-credentials:
    get:
      operationId: listSourceCredentials
      summary: List the organization's source credentials (metadata only)
      description: Requires corpus:manage. The secret is never returned.
      parameters:
        - {name: after, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Page sorted by identifier
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SourceCredential'}}
                  next: {type: string}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSourceCredential
      summary: Store a read-only forge token, sealed
      description: >-
        Requires corpus:manage. The secret is sealed with AES-GCM under a key
        derived from the installation's receipt key; only the worker opens it,
        when it fetches. Audited source_credential.created.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, host, secret]
              properties:
                name: {$ref: '#/components/schemas/Name'}
                kind: {type: string, enum: [github, gitlab]}
                host: {type: string, minLength: 1, maxLength: 253, example: gitlab.example.org}
                secret: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
      responses:
        '201':
          description: Stored; the answer carries no secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredential'}
        '409': {$ref: '#/components/responses/Problem'}  # source_credential_name_taken
        default: {$ref: '#/components/responses/Problem'}
  /v1/source-credentials/{id}/rotate:
    post:
      operationId: rotateSourceCredential
      summary: Replace the secret; the generation grows by one
      description: Requires corpus:manage. Audited source_credential.rotated. A disabled credential answers 409 invalid_transition.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredential'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/source-credentials/{id}/disable:
    post:
      operationId: disableSourceCredential
      summary: Disable a credential and erase its ciphertext
      description: Requires corpus:manage. Idempotent. Audited source_credential.disabled. Builds that need it fail access_denied.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyCommand'}
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredential'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpora:
    get:
      operationId: listCorpora
      summary: List the organization's corpora
      description: Requires corpus:read.
      parameters:
        - {name: name, in: query, schema: {$ref: '#/components/schemas/Name'}}
        - {name: after, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Page sorted by identifier
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Corpus'}}
                  next: {type: string}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCorpus
      summary: Declare a corpus from a Git repository
      description: >-
        Requires corpus:manage. Audited corpus.created. The source does not
        change afterwards. A credential that is unknown, disabled, or of
        another kind or host answers 422 source_credential_unavailable; a name
        the organization uses answers 409 corpus_name_taken.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, source]
              properties:
                name: {$ref: '#/components/schemas/Name'}
                title: {type: string, maxLength: 200}
                source: {$ref: '#/components/schemas/CorpusSource'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Corpus'}
        '409': {$ref: '#/components/responses/Problem'}  # corpus_name_taken
        '422': {$ref: '#/components/responses/Problem'}  # source_credential_unavailable
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpora/{id}:
    get:
      operationId: getCorpus
      summary: One corpus
      description: Requires corpus:read.
      parameters: [{$ref: '#/components/parameters/ResourceID'}]
      responses:
        '200':
          description: Corpus
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Corpus'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpora/{id}/builds:
    post:
      operationId: requestCorpusBuild
      summary: Start an asynchronous build of a commit
      description: >-
        Requires corpus:manage. Answers 202 with the build, QUEUED; follow it
        with GET /v1/corpus-builds/{id} or `agentcapsule operation wait --type
        corpus-build`. ref defaults to the corpus's; commit pins a SHA and
        skips the resolution; at most one of them. Builds of one organization
        run one at a time. Audited corpus_build.requested. Refused with 409
        organization_quota_exceeded (quota max_corpus_builds or
        max_corpus_storage_mib) and 503 storage_pressure before anything is
        recorded.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref: {type: string, minLength: 1, maxLength: 255}
                commit: {type: string, pattern: '^[0-9a-f]{40}$'}
      responses:
        '202':
          description: Build accepted, or initial receipt replayed
          headers:
            Idempotency-Replayed: {schema: {type: boolean}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusBuild'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}  # organization_quota_exceeded
        '503': {$ref: '#/components/responses/Problem'}  # storage_pressure
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds:
    get:
      operationId: listCorpusBuilds
      summary: List builds
      description: Requires corpus:read.
      parameters:
        - {name: corpus_id, in: query, schema: {type: string, maxLength: 100}}
        - {name: state, in: query, schema: {$ref: '#/components/schemas/CorpusBuildState'}}
        - {name: after, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Page, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CorpusBuild'}}
                  next: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}:
    get:
      operationId: getCorpusBuild
      summary: State, commit, counters and costs of a build
      description: Requires corpus:read.
      parameters: [{$ref: '#/components/parameters/ResourceID'}]
      responses:
        '200':
          description: Build
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusBuild'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}/cancel:
    post:
      operationId: cancelCorpusBuild
      summary: Cancel a build before publication
      description: >-
        Requires corpus:manage. Purges its staging files, its output and, in
        REVIEW, its review bundle; removes its try bindings at the agents'
        next boot. A final build answers 409 invalid_transition. Audited
        corpus_build.canceled.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyCommand'}
      responses:
        '200':
          description: Canceled, or initial receipt replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusBuild'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}/review:
    get:
      operationId: listCorpusBuildReview
      summary: The files of a build's review bundle
      description: >-
        Requires corpus:manage. INDEX.md, report.json and each document's
        README.md, read out of the image by the worker, at most 8 MiB in
        total. 404 before REVIEW and after the bundle is purged.
      parameters: [{$ref: '#/components/parameters/ResourceID'}]
      responses:
        '200':
          description: Bundle
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, bytes, sha256]
                      properties:
                        path: {type: string, maxLength: 1024}
                        bytes: {type: integer, minimum: 0, maximum: 1048576}
                        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  truncated: {type: boolean, description: The bundle reached 8 MiB and stops there}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}/review-file:
    get:
      operationId: getCorpusBuildReviewFile
      summary: One file of a build's review bundle
      description: Requires corpus:manage. `corpus-build index` reads path=INDEX.md; `corpus-build files` reads path=report.json and filters it.
      parameters:
        - {$ref: '#/components/parameters/ResourceID'}
        - {name: path, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 1024}}
      responses:
        '200':
          description: The file as stored; Cache-Control no-store
          content:
            text/markdown: {schema: {type: string}}
            application/json: {schema: {type: object}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}/try:
    post:
      operationId: tryCorpusBuild
      summary: Bind a build in REVIEW to an agent of the organization, at its next boot
      description: >-
        Requires corpus:manage and agent:manage. Replaces the agent's binding
        of the same corpus. A build not in REVIEW answers 409
        invalid_transition; an agent that cannot mount corpora 422
        corpus_incompatible. Audited corpus_build.tried.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id]
              properties:
                agent_id: {type: string, minLength: 1, maxLength: 100}
                mount: {$ref: '#/components/schemas/Mount'}
      responses:
        '200':
          description: Bound at the next boot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCorpora'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-builds/{id}/publish:
    post:
      operationId: publishCorpusBuild
      summary: Publish a build in REVIEW as an immutable name:version
      description: >-
        Requires corpus:manage. 201 creates the release; 200 answers the
        existing release when name:version already holds this build's
        digest; 409 version_conflict when it holds another; 409
        invalid_transition when the build is not in REVIEW. A build publishes
        at most once. Audited corpus_build.published.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {$ref: '#/components/schemas/Version'}
      responses:
        '200':
          description: The version already holds this digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusRelease'}
        '201':
          description: Published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusRelease'}
        '409': {$ref: '#/components/responses/Problem'}  # version_conflict, invalid_transition
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-releases:
    get:
      operationId: listCorpusReleases
      summary: List releases
      description: Requires corpus:read. Deprecated releases only with include_deprecated=true.
      parameters:
        - {name: corpus_id, in: query, schema: {type: string, maxLength: 100}}
        - {name: include_deprecated, in: query, schema: {type: boolean, default: false}}
        - {name: after, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Page sorted by corpus, then version
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CorpusRelease'}}
                  next: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-releases/{id}:
    get:
      operationId: getCorpusRelease
      summary: One release
      description: Requires corpus:read.
      parameters: [{$ref: '#/components/parameters/ResourceID'}]
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusRelease'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/corpus-releases/{id}/deprecate:
    post:
      operationId: deprecateCorpusRelease
      summary: Stop new bindings of a release
      description: >-
        Requires corpus:manage. Agents already bound keep it. Its image
        leaves the host's cache once nothing pins it. Idempotent; audited
        corpus_release.deprecated once.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyCommand'}
      responses:
        '200':
          description: Deprecated, or initial receipt replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CorpusRelease'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agents/{id}/corpora:
    get:
      operationId: getAgentCorpora
      summary: An agent's corpus binding
      description: Requires agent:read and corpus:read.
      parameters: [{$ref: '#/components/parameters/ResourceID'}]
      responses:
        '200':
          description: Binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCorpora'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: setAgentCorpora
      summary: Replace an agent's corpus binding, at its next boot
      description: >-
        Requires agent:manage and corpus:read. Each release must be of the
        organization, not deprecated, and on the agent's host (422
        corpus_unavailable); the agent's harness and system image must mount
        corpora (422 corpus_incompatible). A running VM keeps its corpora
        until it stops. Audited agent.corpora_changed; no policy version
        change.
      parameters: [{$ref: '#/components/parameters/ResourceID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [corpora]
              properties:
                corpora: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/CorpusBinding'}}
      responses:
        '200':
          description: Binding replaced (or unchanged), or initial receipt replayed
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/AgentCorpora'}
                  - type: object
                    required: [previous]
                    properties:
                      previous: {type: array, items: {$ref: '#/components/schemas/AgentCorpusEntry'}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}  # agent_unavailable
        '422': {$ref: '#/components/responses/Problem'}  # corpus_unavailable, corpus_incompatible
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer, description: Opaque acps_ token of a tenant service account (as in openapi/openapi.yaml)}
    delegatedBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Delegated EdDSA JWT (as in openapi/openapi.yaml)}
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 100}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: As in openapi/openapi.yaml.
      schema: {type: string, minLength: 1, maxLength: 200}
  requestBodies:
    EmptyCommand:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: false}
  responses:
    Problem:
      description: Error with a stable code (application/problem+json, as in openapi/openapi.yaml)
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string, const: 'about:blank'}
              title: {type: string}
              status: {type: integer}
              code:
                type: string
                description: >-
                  New with corpora: version_conflict, corpus_unavailable,
                  corpus_incompatible, corpus_name_taken,
                  source_credential_name_taken, source_credential_unavailable.
              quota:
                type: string
                enum: [max_agents, max_storage_mib, max_active_vms, max_vcpus, max_memory_mib, max_corpus_storage_mib, max_corpus_builds]
  schemas:
    Name:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,99}$'
    Mount:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
      description: Directory under /corpus/; defaults to the corpus name when that name is a valid mount
    Version:
      type: integer
      minimum: 1
      maximum: 2147483647
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    SourceCredential:
      type: object
      required: [id, name, kind, host, generation, status, created_at]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/Name'}
        kind: {type: string, enum: [github, gitlab]}
        host: {type: string}
        generation: {type: integer, minimum: 1}
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        rotated_at: {type: string, format: date-time}
        disabled_at: {type: string, format: date-time}
    CorpusSource:
      type: object
      additionalProperties: false
      required: [kind, url, ref]
      properties:
        kind: {type: string, enum: [github, gitlab]}
        url: {type: string, maxLength: 512, description: 'https://<host>/<repository>, no user, query or fragment', example: 'https://gitlab.example.org/school/finance-l3'}
        ref: {type: string, minLength: 1, maxLength: 255, description: Branch, tag or commit resolved to a commit at each build}
        path: {type: string, maxLength: 1024, description: Clean relative directory holding agentcapsule-corpus.yaml; default the repository root}
        credential_id: {type: string, maxLength: 100, description: A source credential of the same kind and host; absent for a public repository}
    Corpus:
      type: object
      required: [id, name, source, created_at]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/Name'}
        title: {type: string}
        source: {$ref: '#/components/schemas/CorpusSource'}
        latest_build_id: {type: string}
        latest_release: {$ref: '#/components/schemas/CorpusReleaseReference'}
        created_at: {type: string, format: date-time}
    CorpusBuildState:
      type: string
      enum: [QUEUED, FETCHING, SCANNING, FETCHING_LFS, CONVERTING, PACKAGING, REVIEW, PUBLISHED, FAILED, CANCELED, EXPIRED]
    CorpusBuild:
      type: object
      required: [id, corpus_id, state, attempts, created_at]
      properties:
        id: {type: string}
        corpus_id: {type: string}
        state: {$ref: '#/components/schemas/CorpusBuildState'}
        requested_ref: {type: string}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        builder: {type: string, description: The builder harness release, name@version}
        archive_bytes: {type: integer, minimum: 0}
        lfs_objects: {type: integer, minimum: 0}
        lfs_bytes: {type: integer, minimum: 0}
        files:
          type: object
          properties:
            total: {type: integer, minimum: 0}
            converted: {type: integer, minimum: 0}
            cached: {type: integer, minimum: 0}
            skipped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
        estimate:
          type: object
          description: The builder's scan estimate
          properties:
            llm_calls: {type: integer, minimum: 0}
            input_tokens: {type: integer, minimum: 0}
            audio_seconds: {type: integer, minimum: 0}
            pages: {type: integer, minimum: 0}
        costs:
          type: object
          description: The builder's metered model calls while the build ran
          properties:
            llm_calls: {type: integer, minimum: 0}
            input_tokens: {type: integer, minimum: 0}
            output_tokens: {type: integer, minimum: 0}
            audio_seconds: {type: integer, minimum: 0}
            pages: {type: integer, minimum: 0}
            cost_micros: {type: [integer, 'null'], minimum: 0, description: Null when an alias used is unpriced}
        image_bytes: {type: integer, minimum: 0}
        image_digest: {$ref: '#/components/schemas/Digest'}
        error_code:
          type: string
          enum: [policy, not_found, access_denied, integrity, too_large, invalid_manifest, builder_failed, invalid_image, timeout, unavailable, storage_pressure, quota_exceeded]
        release_id: {type: string}
        attempts: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
        review_at: {type: string, format: date-time}
        review_expires_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    CorpusReleaseReference:
      type: object
      required: [id, name, version]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/Name'}
        version: {$ref: '#/components/schemas/Version'}
    CorpusRelease:
      type: object
      required: [id, corpus_id, name, version, digest, image_bytes, build_id, commit, state, created_at]
      properties:
        id: {type: string}
        corpus_id: {type: string}
        name: {$ref: '#/components/schemas/Name'}
        version: {$ref: '#/components/schemas/Version'}
        digest: {$ref: '#/components/schemas/Digest'}
        image_bytes: {type: integer, minimum: 0}
        build_id: {type: string}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        builder: {type: string}
        host_id: {type: string, description: The host whose cache holds the image (one host in this version)}
        state: {type: string, enum: [active, deprecated]}
        created_at: {type: string, format: date-time}
        deprecated_at: {type: string, format: date-time}
    CorpusBinding:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        version: {$ref: '#/components/schemas/Version'}
        mount: {$ref: '#/components/schemas/Mount'}
    AgentCorpusEntry:
      type: object
      required: [mount]
      description: A release, or a build in REVIEW bound by a try
      properties:
        mount: {$ref: '#/components/schemas/Mount'}
        release: {$ref: '#/components/schemas/CorpusReleaseReference'}
        build_id: {type: string}
        digest: {$ref: '#/components/schemas/Digest'}
    AgentCorpora:
      type: object
      required: [agent_id, corpora, applies]
      properties:
        agent_id: {type: string}
        corpora: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/AgentCorpusEntry'}}
        applies: {type: string, enum: [next_boot]}
x-changes-to-served-schemas:
  - schema: TemplateSpec
    lot: 6
    change: >-
      Add corpora: {type: array, maxItems: 4, items: CorpusBinding}. Each
      corpus once, mounts distinct. Publishing corpora also requires
      corpus:read. 422 corpus_unavailable, 422 corpus_incompatible.
  - schema: SystemImage
    lot: 4
    change: >-
      Add features: {type: array, uniqueItems: true, items: {type: string,
      enum: [corpus.mount]}, default: []}, fixed at approval.
  - schema: OrganizationQuotas and OrganizationQuotaStatus
    lot: 6
    change: >-
      Add max_corpus_storage_mib (integer or null) and max_corpus_builds
      (integer or null), and their usage.
  - route: POST /v1/llm/aliases
    lot: 2
    change: >-
      Add operations: {type: array, uniqueItems: true, minItems: 1, items:
      {type: string, enum: [chat, vision, embed, transcribe, ocr]}, default:
      [chat]}. GET /v1/llm/aliases shows it.
  - route: POST /v1/llm/aliases/{alias}/operations
    lot: 2
    change: >-
      New route, provider:manage, owners and administrators: {operations}
      replaces the alias's operations; audited alias.operations_set; a
      disabled alias answers 409.
  - route: POST /v1/llm/aliases/{alias}/prices
    lot: 2
    change: >-
      Add the optional audio_micro_per_minute and ocr_micro_per_page
      (integer 0 to 1000000000000).
  - route: GET /v1/llm/usage
    lot: 2
    change: Add audio_seconds and pages to each row.
