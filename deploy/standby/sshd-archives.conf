# Append to /etc/ssh/sshd_config on the standby host (a Match block comes
# last), then run `sshd -t && systemctl reload ssh`. The host's
# agentcapsule-archive-ship.py writes the volume archives as the archives
# user, into /srv/backup/archives/volumes. The user sees nothing else: its
# home is its chroot, it runs no command, and its key file lies outside the
# chroot, so that it cannot change it. The umask makes files 0640 and
# directories 0750: the archives group reads them, no one else does.
Match User archives
    ChrootDirectory %h
    ForceCommand internal-sftp -u 0027
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
