# Append to postgresql.conf on the standby host (REC-03). The standby replays
# the WAL archive and answers read-only queries. The build
# (`pgbackrest --stanza=agentcapsule --type=standby --delta restore`) writes
# the rest into the data directory: standby.signal, and in
# postgresql.auto.conf a command that searches both repositories in order:
#   restore_command = 'pgbackrest --stanza=agentcapsule archive-get %f "%p"'
hot_standby = on
# As on the primary, so that the standby can take over.
wal_level = replica
max_wal_senders = 3
# archive_mode needs a restart, so it is on from the start, but with no
# command: the standby archives nothing, and once promoted it keeps every new
# WAL segment until the promotion procedure gives it its own repositories. It
# must never push into the old primary's repositories.
archive_mode = on
archive_command = ''
archive_timeout = 300
# Not above archive_timeout, as on the primary (deploy/backup/postgresql.conf).
checkpoint_timeout = 300
