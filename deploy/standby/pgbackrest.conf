# pgBackRest on the standby host (REC-03, ADR 004). The primary pushes its WAL
# and backups into this host over SFTP (repository 2 of deploy/backup); here,
# PostgreSQL replays that archive continuously, as a standby ready to be
# promoted. The standby only reads: it takes no backup, expires nothing, and
# archives nothing until the promotion procedure (docs/recovery.md) gives it
# repositories of its own. Install as /etc/pgbackrest/pgbackrest.conf
# (root:postgres, 0640); the secrets live in conf.d/secrets.conf (postgres,
# 0600). scripts/verify-backups.py qualifies this layout.
[global]
# Repository 1: the directory the SFTP server writes, read on this host's own
# disk. The backup user owns it; postgres reads it through the backup group
# and cannot write it. pgBackRest fetches WAL from the repositories in order,
# so this local copy comes first: no network, no cost.
repo1-type=posix
repo1-path=/srv/backup/repo
repo1-cipher-type=aes-256-cbc

# Repository 2: the S3 store, with a read-only credential. A segment that did
# not reach this host (the primary cannot reach it, an SFTP push failed) still
# comes from there, so the replay goes on and a promotion loses no more than
# the fresher of the two stores.
repo2-type=s3
repo2-path=/agentcapsule
repo2-s3-bucket=agentcapsule-backups
repo2-s3-endpoint=s3.example.net
repo2-s3-region=fr-par
repo2-s3-uri-style=path
repo2-cipher-type=aes-256-cbc

# Fetch the next segments while PostgreSQL replays the current one.
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
log-level-file=info
log-path=/var/log/pgbackrest

[agentcapsule]
pg1-path=/var/lib/postgresql/18/main
