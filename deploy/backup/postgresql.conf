# Append to postgresql.conf (REC-03). archive_timeout closes a WAL segment at
# least every 5 minutes, so a commit reaches both repositories within about
# 5 minutes: the RPO of 15 minutes (ADR 004) keeps a margin for an outage of
# one store. pgBackRest's asynchronous push keeps archiving off the commit path.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=agentcapsule archive-push %p'
archive_timeout = 300
max_wal_senders = 3
