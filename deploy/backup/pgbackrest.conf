# pgBackRest for one Agent Capsule host (REC-03, ADR 004): every WAL segment
# and every base backup goes to two repositories, each encrypted with its own
# passphrase before it leaves the host. Install as /etc/pgbackrest/pgbackrest.conf
# (root:postgres, 0640); the secrets live in conf.d/secrets.conf (0600,
# postgres). scripts/verify-backups.py qualifies this layout.
[global]
# Repository 1: S3-compatible object storage, versioned at the provider.
repo1-type=s3
repo1-path=/agentcapsule
repo1-s3-bucket=agentcapsule-backups
repo1-s3-endpoint=s3.example.net
repo1-s3-region=fr-par
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Four weekly full backups; the WAL archive follows them.
repo1-retention-full=4

# Repository 2: the standby host over SFTP, also its source of WAL to replay.
repo2-type=sftp
repo2-path=/repo
repo2-sftp-host=standby.example.net
repo2-sftp-host-user=backup
repo2-sftp-private-key-file=/var/lib/postgresql/.ssh/backup_ed25519
repo2-sftp-public-key-file=/var/lib/postgresql/.ssh/backup_ed25519.pub
# The standby's host key, checked strictly against this file.
repo2-sftp-host-key-check-type=strict
repo2-sftp-host-key-hash-type=sha256
repo2-sftp-known-host=/etc/pgbackrest/known_hosts
repo2-cipher-type=aes-256-cbc
repo2-retention-full=2

# A segment is pushed as soon as PostgreSQL closes it, to both repositories.
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
compress-type=zst
start-fast=y
log-level-file=info
log-path=/var/log/pgbackrest

[agentcapsule]
pg1-path=/var/lib/postgresql/18/main
