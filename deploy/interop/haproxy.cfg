# Mutual-TLS edge in front of the Directory API server, which has no
# authentication of its own. A client needs a certificate from the Directory CA
# with the control plane's common name; anything else fails at the handshake.
global
    nbthread 1
    maxconn 256
    log stdout format raw local0 info
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend directory
    # alpn h2: gRPC clients require it.
    bind :8443 ssl crt /certs/edge.pem ca-file /certs/ca.pem verify required alpn h2
    tcp-request session reject unless { ssl_c_s_dn(CN) -m str agentcapsule-control-plane }
    default_backend directory

backend directory
    server directory directory:8888
