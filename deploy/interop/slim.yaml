# SLIM node 3.4.6: one data-plane endpoint, TLS 1.3 with a mandatory client
# certificate from the SLIM CA. No controller and no telemetry export. The node
# opens no outbound connection.
tracing:
  log_level: info
  opentelemetry:
    enabled: false
runtime:
  n_cores: 2
  drain_timeout: 10s
services:
  slim/0:
    node_id: agentcapsule-slim
    dataplane:
      servers:
        - endpoint: "0.0.0.0:46357"
          tls:
            source:
              type: file
              cert: /etc/slim/tls/server.pem
              key: /etc/slim/tls/server.key
            client_ca:
              type: file
              path: /etc/slim/tls/ca.pem
            include_system_ca_certs_pool: false
          auth:
            type: none
      clients: []
