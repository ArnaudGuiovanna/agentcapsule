# Alerts of one Agent Capsule host (OPS-02, OPS-03, REC-03), on the metrics the
# API and the worker serve at /metrics (agentcapsule-api -metrics-listen, the
# worker's "metrics_listen") and on node_exporter's. The scrape jobs are named
# agentcapsule-api, agentcapsule-worker and node (prometheus.yml). Annotations
# are fixed text: metrics carry no organization, agent or member, so neither do
# alerts.
groups:
  - name: agentcapsule
    rules:
      - alert: AgentCapsuleTargetDown
        expr: up{job=~"agentcapsule-api|agentcapsule-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: An Agent Capsule process does not answer its metrics scrape.

      - alert: AgentCapsuleAPIServerErrors
        expr: |
          sum by (job, instance) (rate(agentcapsule_api_requests_total{status_class="5xx"}[5m]))
            / sum by (job, instance) (rate(agentcapsule_api_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5 % of API requests fail with a server error.

      - alert: AgentCapsuleQueueDelayed
        expr: agentcapsule_worker_job_oldest_due_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A due worker job has waited more than 5 minutes past its time.

      - alert: AgentCapsuleJobsFailing
        expr: agentcapsule_worker_jobs_failing > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Worker jobs keep failing (three attempts or more).

      - alert: AgentCapsuleVMBootFailures
        expr: increase(agentcapsule_worker_vm_starts_total{outcome="failed"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: VMs failed to boot more than 3 times in 15 minutes.

      - alert: AgentCapsuleCapacityExhausted
        expr: agentcapsule_worker_vms_running >= agentcapsule_worker_vm_capacity
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The host runs as many VMs as max_active allows; waking an agent stops another.

      - alert: AgentCapsuleDiskPressure
        expr: agentcapsule_worker_root_disk_used_ratio > 0.70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The runtime root's file system is more than 70 % full.

      - alert: AgentCapsuleDiskCritical
        expr: agentcapsule_worker_root_disk_used_ratio > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The runtime root's file system is more than 80 % full.

      - alert: AgentCapsuleSLIMUnavailable
        expr: increase(agentcapsule_worker_job_retries_total{reason="slim_unavailable"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Deliveries between agents wait for the SLIM bridge or node.

      - alert: AgentCapsuleDirectoryUnavailable
        expr: increase(agentcapsule_worker_directory_publish_retries_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The worker cannot publish to the Directory.

      - alert: AgentCapsuleWakeBudgetExhausted
        expr: increase(agentcapsule_worker_job_retries_total{reason="wake_budget"}[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: An organization's agents reached their wake budget; requests wait.

      - alert: AgentCapsuleMetricsStale
        expr: increase(agentcapsule_telemetry_collect_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A process cannot read its current state for its metrics (database or disk).

  # Backup freshness against the recovery objectives (REC-03, ADR 004): the
  # database's RPO is 15 minutes. WAL archiving comes from the worker, which
  # reads PostgreSQL; base backups come from node_exporter's textfile
  # collector, written by deploy/backup/agentcapsule-backup-metrics.py.
  - name: agentcapsule-backups
    rules:
      - alert: AgentCapsuleWALArchivingMisconfigured
        expr: |
          agentcapsule_postgres_wal_archiving_enabled == 0
            or agentcapsule_postgres_wal_archive_timeout_seconds == 0
            or agentcapsule_postgres_wal_archive_timeout_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).

      - alert: AgentCapsuleWALArchiveFailing
        expr: agentcapsule_postgres_wal_archive_failing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL's WAL archiving keeps failing; the database's 15-minute RPO is at risk.

      - alert: AgentCapsuleWALArchiveStale
        expr: agentcapsule_postgres_wal_archive_age_seconds > 900 and agentcapsule_postgres_wal_archive_pending == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No WAL archived for 15 minutes while a completed segment waits; the database's RPO is breached.

      - alert: AgentCapsuleWALArchiveBacklog
        expr: agentcapsule_postgres_wal_archive_pending == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Completed WAL segments have waited for archiving for 15 minutes; archiving does not keep up.

      - alert: AgentCapsuleBackupStale
        expr: time() - max by (job, instance, repo) (agentcapsule_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A backup repository has no base backup that finished in the last 26 hours.

      - alert: AgentCapsuleFullBackupStale
        expr: time() - agentcapsule_backup_last_success_timestamp_seconds{type="full"} > 8 * 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A backup repository has no full backup that finished in the last 8 days.

      - alert: AgentCapsuleBackupRepositoryUnreadable
        expr: agentcapsule_backup_repository_readable == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: pgBackRest cannot read a backup repository; its backups cannot be checked.

      - alert: AgentCapsuleBackupMetricsStale
        expr: |
          time() - agentcapsule_backup_collected_timestamp_seconds > 3600
            or absent(agentcapsule_backup_collected_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).

      # Volume RPO 24 h (ADR 004): a running agent is archived once its newest
      # archive is 24 h old, a sleeping one earlier. Two hours late breaks it.
      - alert: AgentCapsuleVolumeArchiveStale
        expr: agentcapsule_worker_volume_archive_oldest_seconds > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: An agent of this host has no volume archive from the last 26 hours.

      # The volume archives off the host (REC-02): every hour,
      # deploy/backup/agentcapsule-archive-ship.py ships them to the stores s3
      # and standby, then writes these for node_exporter's textfile collector.
      # An archive normally reaches both stores within the hour. Two hours
      # without a complete ship is two missed runs: 24 h plus 2 h, the bound
      # of AgentCapsuleVolumeArchiveStale.
      - alert: AgentCapsuleArchiveShipBehind
        expr: time() - agentcapsule_archive_ship_last_success_timestamp_seconds > 2 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A store has lacked some of this host's volume archives for 2 hours.

      - alert: AgentCapsuleArchiveStoreUnreadable
        expr: agentcapsule_archive_ship_store_readable == 0
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: The volume archive shipper could not list a store, at two runs in a row.

      - alert: AgentCapsuleArchiveChanged
        expr: agentcapsule_archive_ship_changed_archives > 0
        labels:
          severity: critical
        annotations:
          summary: A volume archive changed on this host after it was shipped; the store keeps the copy it received.

      - alert: AgentCapsuleArchiveShipMetricsStale
        expr: |
          time() - agentcapsule_archive_ship_collected_timestamp_seconds > 3 * 3600
            or absent(agentcapsule_archive_ship_collected_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The volume archive shipper has not run for 3 hours, or never ran (agentcapsule-archive-ship.timer or node_exporter's textfile collector).

  # The standby (REC-03): every minute, on the standby host,
  # deploy/standby/agentcapsule-standby-metrics.py writes these for
  # node_exporter. The primary commits an empty transaction every minute
  # (agentcapsule-pg-heartbeat.timer), so a standby that keeps up has always
  # replayed one from the last 6 or 7 minutes, even on an idle platform.
  - name: agentcapsule-standby
    rules:
      - alert: AgentCapsuleStandbyReplayBehind
        expr: agentcapsule_standby_in_recovery == 1 and time() - agentcapsule_standby_replay_timestamp_seconds > 900
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The standby has replayed no transaction committed in the last 15 minutes; it is behind the database's RPO.

      - alert: AgentCapsuleStandbyNotInRecovery
        expr: agentcapsule_standby_in_recovery == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The standby's PostgreSQL is not in recovery; it was promoted or started as a primary, and no longer follows the archive.

      - alert: AgentCapsuleStandbyDown
        expr: agentcapsule_standby_postgres_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The standby's PostgreSQL does not answer; it cannot take over.

      - alert: AgentCapsuleStandbyMetricsStale
        expr: |
          time() - agentcapsule_standby_collected_timestamp_seconds > 600
            or absent(agentcapsule_standby_collected_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The standby's replay has not been collected for 10 minutes, or never was (agentcapsule-standby-metrics.timer or node_exporter's textfile collector).

  # Host resources, from node_exporter on the same host.
  - name: agentcapsule-host
    rules:
      - alert: AgentCapsuleHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 10 % of the host's memory is available.

      - alert: AgentCapsuleHostCPUSaturated
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The host's CPUs are more than 90 % busy.
