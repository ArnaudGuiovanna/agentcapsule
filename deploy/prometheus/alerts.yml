# Alerts of one Agent Capsule host (OPS-02, OPS-03, REC-03), on the metrics the
# API, the worker and the authority service serve at /metrics
# (agentcapsule-api -metrics-listen, the worker's and the service's
# "metrics_listen") and on node_exporter's. The scrape jobs are named
# agentcapsule-api, agentcapsule-worker, agentcapsule-authority and node
# (prometheus.yml). Annotations
# are fixed text: metrics carry no organization, agent or member, so neither do
# alerts.
groups:
  - name: agentcapsule
    rules:
      - alert: AgentCapsuleTargetDown
        expr: up{job=~"agentcapsule-api|agentcapsule-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: An Agent Capsule process does not answer its metrics scrape.

      - alert: AgentCapsuleAPIServerErrors
        expr: |
          sum by (job, instance) (rate(agentcapsule_api_requests_total{status_class="5xx"}[5m]))
            / sum by (job, instance) (rate(agentcapsule_api_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5 % of API requests fail with a server error.

      - alert: AgentCapsuleQueueDelayed
        expr: agentcapsule_worker_job_oldest_due_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A due worker job has waited more than 5 minutes past its time.

      # The invocations' own wait (OPS-03): an agent's deliveries share one
      # job, so a growing backlog does not show in the jobs' delay above.
      - alert: AgentCapsuleInvocationsDelayed
        expr: agentcapsule_worker_invocation_oldest_waiting_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An invocation has waited more than 15 minutes to be delivered to its agent.

      - alert: AgentCapsuleJobsFailing
        expr: agentcapsule_worker_jobs_failing > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Worker jobs keep failing (three attempts or more).

      # A reply or status that dies (ADR 007): the request keeps its outcome
      # and the sender's agent can still read a reply, but the operator is
      # told. An instruction's death is its requester's dead letter
      # (?state=failed|expired), so it is counted but does not alert.
      - alert: AgentCapsuleDeliveryDead
        expr: increase(agentcapsule_worker_deliveries_dead_total{kind=~"reply|status"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A reply or status could not be delivered to the agent that sent the request; the request keeps its outcome.

      - alert: AgentCapsuleVMBootFailures
        expr: increase(agentcapsule_worker_vm_starts_total{outcome="failed"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: VMs failed to boot more than 3 times in 15 minutes.

      # An agent whose guest kept failing to boot or crashing (ADR 012): it is
      # FAILED and boots again only when woken or cleared by the operator.
      - alert: AgentCapsuleAgentFailed
        expr: increase(agentcapsule_worker_agents_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: An agent spent its restart budget and is FAILED until it is woken.

      - alert: AgentCapsuleCapacityExhausted
        expr: agentcapsule_worker_vms_running >= agentcapsule_worker_vm_capacity
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The host runs as many VMs as max_active allows; new work stops an idle VM or waits.

      # Work waits for a VM slot (ADR 017): every VM of the host is computing.
      # It boots in arrival order as slots free, or expires with
      # capacity_unavailable.
      - alert: AgentCapsuleWorkWaitingForCapacity
        expr: agentcapsule_worker_capacity_oldest_wait_seconds > 600
        labels:
          severity: warning
        annotations:
          summary: Work has waited more than 10 minutes for a VM slot; raise max_active or add a host.

      - alert: AgentCapsuleDiskPressure
        expr: agentcapsule_worker_root_disk_used_ratio > 0.70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The runtime root's file system is more than 70 % full.

      - alert: AgentCapsuleDiskCritical
        expr: agentcapsule_worker_root_disk_used_ratio > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The runtime root's file system is more than 80 % full.

      # The harness images may have a file system of their own (the
      # registry's cache); the same 70 % and 80 % levels apply (OPS-03).
      - alert: AgentCapsuleImageDiskPressure
        expr: agentcapsule_worker_image_disk_used_ratio > 0.70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The file system of the harness images is more than 70 % full.

      - alert: AgentCapsuleImageDiskCritical
        expr: agentcapsule_worker_image_disk_used_ratio > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The file system of the harness images is more than 80 % full.

      # Past storage_pressure (0.80 by default), the API refuses new agents
      # (data) or imports (images) with storage_pressure (ADR 014).
      - alert: AgentCapsuleStoragePressure
        expr: agentcapsule_worker_storage_pressure == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A file system of the host is past its storage pressure threshold; new agents or harness imports are refused.

      - alert: AgentCapsuleSLIMUnavailable
        expr: increase(agentcapsule_worker_job_retries_total{reason="slim_unavailable"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Deliveries between agents wait for the SLIM bridge or node.

      - alert: AgentCapsuleDirectoryUnavailable
        expr: increase(agentcapsule_worker_directory_publish_retries_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The worker cannot publish to the Directory.

      - alert: AgentCapsuleWakeBudgetExhausted
        expr: increase(agentcapsule_worker_job_retries_total{reason="wake_budget"}[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: An organization's agents reached their wake budget; requests wait.

      - alert: AgentCapsuleMetricsStale
        expr: increase(agentcapsule_telemetry_collect_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A process cannot read its current state for its metrics (database or disk).

  # Backup freshness against the recovery objectives (REC-03, ADR 004): the
  # database's RPO is 15 minutes. WAL archiving comes from the worker, which
  # reads PostgreSQL; base backups come from node_exporter's textfile
  # collector, written by deploy/backup/agentcapsule-backup-metrics.py.
  - name: agentcapsule-backups
    rules:
      - alert: AgentCapsuleWALArchivingMisconfigured
        expr: |
          agentcapsule_postgres_wal_archiving_enabled == 0
            or agentcapsule_postgres_wal_archive_timeout_seconds == 0
            or agentcapsule_postgres_wal_archive_timeout_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).

      - alert: AgentCapsuleWALArchiveFailing
        expr: agentcapsule_postgres_wal_archive_failing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL's WAL archiving keeps failing; the database's 15-minute RPO is at risk.

      - alert: AgentCapsuleWALArchiveStale
        expr: agentcapsule_postgres_wal_archive_age_seconds > 900 and agentcapsule_postgres_wal_archive_pending == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No WAL archived for 15 minutes while a completed segment waits; the database's RPO is breached.

      - alert: AgentCapsuleWALArchiveBacklog
        expr: agentcapsule_postgres_wal_archive_pending == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Completed WAL segments have waited for archiving for 15 minutes; archiving does not keep up.

      - alert: AgentCapsuleBackupStale
        expr: time() - max by (job, instance, repo) (agentcapsule_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A backup repository has no base backup that finished in the last 26 hours.

      - alert: AgentCapsuleFullBackupStale
        expr: time() - agentcapsule_backup_last_success_timestamp_seconds{type="full"} > 8 * 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A backup repository has no full backup that finished in the last 8 days.

      - alert: AgentCapsuleBackupRepositoryUnreadable
        expr: agentcapsule_backup_repository_readable == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: pgBackRest cannot read a backup repository; its backups cannot be checked.

      - alert: AgentCapsuleBackupMetricsStale
        expr: |
          time() - agentcapsule_backup_collected_timestamp_seconds > 3600
            or absent(agentcapsule_backup_collected_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).

      # Volume RPO 24 h (ADR 004): a running agent is archived once its newest
      # archive is 24 h old, a sleeping one earlier. Two hours late breaks it.
      - alert: AgentCapsuleVolumeArchiveStale
        expr: agentcapsule_worker_volume_archive_oldest_seconds > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: An agent of this host has no volume archive from the last 26 hours.

      # ADR 018: deleting an agent destroys its volume key within minutes;
      # until then its archives still open. Six hours leaves room for a store
      # that is slow to fence the deletion, or a short degraded period.
      - alert: AgentCapsuleDeletionUnfinished
        expr: agentcapsule_worker_deletion_oldest_seconds > 6 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: An agent's deletion on this host has not finished for 6 hours; its volume key still exists.

      # The volume archives off the host (REC-02): every hour,
      # deploy/backup/agentcapsule-archive-ship.py ships them to the stores s3
      # and standby, then writes these for node_exporter's textfile collector.
      # An archive normally reaches both stores within the hour. Two hours
      # without a complete ship is two missed runs: 24 h plus 2 h, the bound
      # of AgentCapsuleVolumeArchiveStale.
      - alert: AgentCapsuleArchiveShipBehind
        expr: time() - agentcapsule_archive_ship_last_success_timestamp_seconds > 2 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A store has lacked some of this host's volume archives for 2 hours.

      - alert: AgentCapsuleArchiveStoreUnreadable
        expr: agentcapsule_archive_ship_store_readable == 0
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: The volume archive shipper could not list a store, at two runs in a row.

      - alert: AgentCapsuleArchiveChanged
        expr: agentcapsule_archive_ship_changed_archives > 0
        labels:
          severity: critical
        annotations:
          summary: A volume archive changed on this host after it was shipped; the store keeps the copy it received.

      - alert: AgentCapsuleArchiveShipMetricsStale
        expr: |
          time() - agentcapsule_archive_ship_collected_timestamp_seconds > 3 * 3600
            or absent(agentcapsule_archive_ship_collected_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The volume archive shipper has not run for 3 hours, or never ran (agentcapsule-archive-ship.timer or node_exporter's textfile collector).

  # The standby (REC-03): every minute, on the standby host,
  # deploy/standby/agentcapsule-standby-metrics.py writes these for
  # node_exporter. The primary commits an empty transaction every minute
  # (agentcapsule-pg-heartbeat.timer), so a standby that keeps up has always
  # replayed one from the last 6 or 7 minutes, even on an idle platform.
  - name: agentcapsule-standby
    rules:
      - alert: AgentCapsuleStandbyReplayBehind
        expr: agentcapsule_standby_in_recovery == 1 and time() - agentcapsule_standby_replay_timestamp_seconds > 900
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The standby has replayed no transaction committed in the last 15 minutes; it is behind the database's RPO.

      - alert: AgentCapsuleStandbyNotInRecovery
        expr: agentcapsule_standby_in_recovery == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The standby's PostgreSQL is not in recovery; it was promoted or started as a primary, and no longer follows the archive.

      - alert: AgentCapsuleStandbyDown
        expr: agentcapsule_standby_postgres_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The standby's PostgreSQL does not answer; it cannot take over.

      - alert: AgentCapsuleStandbyMetricsStale
        expr: |
          time() - agentcapsule_standby_collected_timestamp_seconds > 600
            or absent(agentcapsule_standby_collected_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The standby's replay has not been collected for 10 minutes, or never was (agentcapsule-standby-metrics.timer or node_exporter's textfile collector).

  # The authorities' replica (D-05, ADR 005), from the authority service
  # (ADR 006). Its authorities write to the replica on the standby. After
  # degraded_after (30 seconds) without it, they enter degraded mode: outcome
  # records and fence revisions continue without the replica; creating,
  # deleting and restoring agents wait. Losing the primary then loses what
  # continued.
  - name: agentcapsule-authorities
    rules:
      # Without the service, no agent boots, platform calls fail, deliveries
      # wait, and a restore pauses.
      - alert: AgentCapsuleAuthorityServiceDown
        expr: up{job="agentcapsule-authority"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The authority service does not answer its metrics scrape; no agent boots and authority operations fail until it returns.

      - alert: AgentCapsuleAuthorityDegraded
        expr: agentcapsule_authority_replication_degraded_since_timestamp_seconds > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The authority service runs in degraded mode without the standby; creating, deleting and restoring agents wait, and losing this host would lose the outcomes recorded since.

      - alert: AgentCapsuleAuthorityOperationsRefused
        expr: increase(agentcapsule_authority_replication_degraded_refused_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Authority operations gave up waiting for the standby in degraded mode; creating, deleting or restoring agents fails until it returns.

      # Outside degraded mode, failures that go on mean that every authority
      # operation waits: an authority service restarted without the standby,
      # which never enters degraded mode, or a replica that refuses this host.
      - alert: AgentCapsuleAuthorityReplicationStopped
        expr: |
          sum by (job, instance) (increase(agentcapsule_authority_replication_errors_total[2m])) > 0
            unless on (job, instance) agentcapsule_authority_replication_degraded_since_timestamp_seconds > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The authority service keeps failing to reach the replica outside degraded mode; every authority operation waits or fails.

      # An access revocation takes effect at once; the API records it in the
      # authority service after its commit, and again every 5 seconds until
      # the service answers (ADR 006, changes after the v0.1.0 audit). Until
      # then a failover or a restore of the database could undo it
      # (docs/recovery.md, Revocations the authority service has not recorded).
      - alert: AgentCapsuleAccessRevocationsUnrecorded
        expr: agentcapsule_api_access_revocation_oldest_unrecorded_seconds > 120
        labels:
          severity: critical
        annotations:
          summary: Access revocations took effect, but the authority service has not recorded them for over two minutes; a failover or a restore of the database now could undo them.
      # The daily receipt keys (ADR 006 wave 6, docs/recovery.md).
      - alert: AgentCapsuleReceiptKeyMissing
        expr: agentcapsule_authority_receipt_key_ready{day="today"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The authority service holds no receipt key of the day; the API refuses every request that takes an idempotency key.
      - alert: AgentCapsuleNextReceiptKeyMissing
        expr: agentcapsule_authority_receipt_key_ready{day="tomorrow"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Tomorrow's receipt key is missing; if the standby does not return by midnight UTC, the next day's key will be created on the primary alone.
      - alert: AgentCapsuleReceiptKeyNotDestroyed
        expr: agentcapsule_authority_receipt_keys_overdue > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A daily receipt key outlives its destruction time; its destruction waits for the standby or fails, and backups of its day stay readable.

  # Host resources, from node_exporter on the same host.
  - name: agentcapsule-host
    rules:
      - alert: AgentCapsuleHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 10 % of the host's memory is available.

      - alert: AgentCapsuleHostCPUSaturated
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The host's CPUs are more than 90 % busy.
