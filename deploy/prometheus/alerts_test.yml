# promtool test rules alerts_test.yml (scripts/verify-alerts.py runs it).
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_root_disk_used_ratio{job="agentcapsule-worker",instance="host-1"}'
        values: '0.50 0.75x20 0.85x10'
      - series: 'agentcapsule_worker_job_oldest_due_seconds{job="agentcapsule-worker",instance="host-1",kind="delivery"}'
        values: '0 400x10'
      - series: 'up{job="agentcapsule-api",instance="host-1"}'
        values: '1 0x5'
      - series: 'agentcapsule_worker_job_retries_total{job="agentcapsule-worker",instance="host-1",kind="delivery",reason="slim_unavailable"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AgentCapsuleDiskPressure
        exp_alerts: []
      - eval_time: 15m
        alertname: AgentCapsuleDiskPressure
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The runtime root's file system is more than 70 % full.
      - eval_time: 15m
        alertname: AgentCapsuleDiskCritical
        exp_alerts: []
      - eval_time: 28m
        alertname: AgentCapsuleDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The runtime root's file system is more than 80 % full.
      - eval_time: 4m
        alertname: AgentCapsuleQueueDelayed
        exp_alerts: []
      - eval_time: 8m
        alertname: AgentCapsuleQueueDelayed
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: delivery}
            exp_annotations:
              summary: A due worker job has waited more than 5 minutes past its time.
      - eval_time: 4m
        alertname: AgentCapsuleTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-api, instance: host-1}
            exp_annotations:
              summary: An Agent Capsule process does not answer its metrics scrape.
      - eval_time: 5m
        alertname: AgentCapsuleSLIMUnavailable
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleSLIMUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: delivery, reason: slim_unavailable}
            exp_annotations:
              summary: Deliveries between agents wait for the SLIM bridge or node.

  # Dead deliveries (ADR 007). A reply dies at minute 2; no status dies; an
  # instruction dies at minute 1, which only its requester is shown.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_deliveries_dead_total{job="agentcapsule-worker",instance="host-1",kind="reply",reason="attempts_exhausted"}'
        values: '0 0 1x30'
      - series: 'agentcapsule_worker_deliveries_dead_total{job="agentcapsule-worker",instance="host-1",kind="status",reason="expired"}'
        values: '0x32'
      - series: 'agentcapsule_worker_deliveries_dead_total{job="agentcapsule-worker",instance="host-1",kind="instruction",reason="expired"}'
        values: '0 1x31'
    alert_rule_test:
      - eval_time: 1m
        alertname: AgentCapsuleDeliveryDead
        exp_alerts: []
      - eval_time: 5m
        alertname: AgentCapsuleDeliveryDead
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: reply, reason: attempts_exhausted}
            exp_annotations:
              summary: A reply or status could not be delivered to the agent that sent the request; the request keeps its outcome.
      - eval_time: 30m
        alertname: AgentCapsuleDeliveryDead
        exp_alerts: []

  # Capacity (OPS-03). The images' file system fills as the runtime root's
  # does above; the images pass the storage pressure threshold at minute 11.
  # Boots fail ten times from minute 6 to 16. The Directory fails from minute
  # 6. Memory runs low from minute 6; the CPUs turn busy at minute 11. The
  # oldest waiting invocation passes 15 minutes at minute 16.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_image_disk_used_ratio{job="agentcapsule-worker",instance="host-1"}'
        values: '0.50 0.75x20 0.85x10'
      - series: 'agentcapsule_worker_storage_pressure{job="agentcapsule-worker",instance="host-1",filesystem="images"}'
        values: '0x10 1x20'
      - series: 'agentcapsule_worker_storage_pressure{job="agentcapsule-worker",instance="host-1",filesystem="data"}'
        values: '0x30'
      - series: 'agentcapsule_worker_vm_starts_total{job="agentcapsule-worker",instance="host-1",outcome="failed"}'
        values: '0x5 0+1x10 10x30'
      - series: 'agentcapsule_worker_directory_publish_retries_total{job="agentcapsule-worker",instance="host-1"}'
        values: '0x5 0+1x40'
      - series: 'node_memory_MemTotal_bytes{job="node",instance="host-1"}'
        values: '1000x45'
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="host-1"}'
        values: '500x5 50x40'
      - series: 'node_cpu_seconds_total{job="node",instance="host-1",cpu="0",mode="idle"}'
        values: '0+60x10 600+3x40'
      - series: 'agentcapsule_worker_invocation_oldest_waiting_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: AgentCapsuleInvocationsDelayed
        exp_alerts: []
      - eval_time: 22m
        alertname: AgentCapsuleInvocationsDelayed
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: An invocation has waited more than 15 minutes to be delivered to its agent.
      - eval_time: 5m
        alertname: AgentCapsuleImageDiskPressure
        exp_alerts: []
      - eval_time: 15m
        alertname: AgentCapsuleImageDiskPressure
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The file system of the harness images is more than 70 % full.
      - eval_time: 15m
        alertname: AgentCapsuleImageDiskCritical
        exp_alerts: []
      - eval_time: 28m
        alertname: AgentCapsuleImageDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The file system of the harness images is more than 80 % full.
      - eval_time: 14m
        alertname: AgentCapsuleStoragePressure
        exp_alerts: []
      - eval_time: 20m
        alertname: AgentCapsuleStoragePressure
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1, filesystem: images}
            exp_annotations:
              summary: A file system of the host is past its storage pressure threshold; new agents or harness imports are refused.
      - eval_time: 5m
        alertname: AgentCapsuleVMBootFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: AgentCapsuleVMBootFailures
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, outcome: failed}
            exp_annotations:
              summary: VMs failed to boot more than 3 times in 15 minutes.
      - eval_time: 40m
        alertname: AgentCapsuleVMBootFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentCapsuleDirectoryUnavailable
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleDirectoryUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The worker cannot publish to the Directory.
      - eval_time: 10m
        alertname: AgentCapsuleHostMemoryLow
        exp_alerts: []
      - eval_time: 20m
        alertname: AgentCapsuleHostMemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1}
            exp_annotations:
              summary: Less than 10 % of the host's memory is available.
      - eval_time: 20m
        alertname: AgentCapsuleHostCPUSaturated
        exp_alerts: []
      - eval_time: 35m
        alertname: AgentCapsuleHostCPUSaturated
        exp_alerts:
          - exp_labels: {severity: warning, instance: host-1}
            exp_annotations:
              summary: The host's CPUs are more than 90 % busy.

  # An agent spends its restart budget at minute 3 (ADR 012).
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_agents_failed_total{job="agentcapsule-worker",instance="host-1"}'
        values: '0 0 0 1x30'
    alert_rule_test:
      - eval_time: 2m
        alertname: AgentCapsuleAgentFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: AgentCapsuleAgentFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: An agent spent its restart budget and is FAILED until it is woken.
      - eval_time: 30m
        alertname: AgentCapsuleAgentFailed
        exp_alerts: []

  # Work waits for a VM slot from minute 1 and boots at minute 20 (ADR 017).
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_capacity_oldest_wait_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '0 0+60x18 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AgentCapsuleWorkWaitingForCapacity
        exp_alerts: []
      - eval_time: 15m
        alertname: AgentCapsuleWorkWaitingForCapacity
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: Work has waited more than 10 minutes for a VM slot; raise max_active or add a host.
      - eval_time: 25m
        alertname: AgentCapsuleWorkWaitingForCapacity
        exp_alerts: []

  # WAL archiving (REC-03). host-1: archiving stuck from the start, failing
  # from minute 6. host-2: an idle database, archived an hour ago, nothing
  # waiting. host-3: archive_mode turned off at minute 10. host-4:
  # archive_timeout above the RPO.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-1"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archive_age_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '0+60x40'
      - series: 'agentcapsule_postgres_wal_archive_pending{job="agentcapsule-worker",instance="host-1"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_failing{job="agentcapsule-worker",instance="host-1"}'
        values: '0x5 1x34'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-2"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archive_age_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '3600+60x40'
      - series: 'agentcapsule_postgres_wal_archive_pending{job="agentcapsule-worker",instance="host-2"}'
        values: '0x40'
      - series: 'agentcapsule_postgres_wal_archive_failing{job="agentcapsule-worker",instance="host-2"}'
        values: '0x40'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-3"}'
        values: '1x9 0x30'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-3"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-4"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-4"}'
        values: '1200x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts: []
      - eval_time: 14m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-4}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
      - eval_time: 16m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-3}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-4}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
      - eval_time: 10m
        alertname: AgentCapsuleWALArchiveFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: AgentCapsuleWALArchiveFailing
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: PostgreSQL's WAL archiving keeps failing; the database's 15-minute RPO is at risk.
      - eval_time: 17m
        alertname: AgentCapsuleWALArchiveStale
        exp_alerts: []
      - eval_time: 19m
        alertname: AgentCapsuleWALArchiveStale
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: No WAL archived for 15 minutes while a completed segment waits; the database's RPO is breached.
      - eval_time: 14m
        alertname: AgentCapsuleWALArchiveBacklog
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleWALArchiveBacklog
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: Completed WAL segments have waited for archiving for 15 minutes; archiving does not keep up.

  # Base backups, from the textfile; times are seconds since the test's start.
  # host-1: a full backup into each repository at 01:00, a differential into
  # S3 only the next night, and the collection stops after 10 hours. host-2:
  # the standby's repository becomes unreadable at 20:00.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="full"}'
        values: '3600x1800'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="diff"}'
        values: '0x1499 90000x300'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="standby",type="full"}'
        values: '3600x1800'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="standby",type="diff"}'
        values: '0x1800'
      - series: 'agentcapsule_backup_collected_timestamp_seconds{job="node",instance="host-1"}'
        values: '0+60x599 35940x1200'
      - series: 'agentcapsule_backup_repository_readable{job="node",instance="host-2",repo="s3"}'
        values: '1x1800'
      - series: 'agentcapsule_backup_repository_readable{job="node",instance="host-2",repo="standby"}'
        values: '1x1199 0x600'
    alert_rule_test:
      - eval_time: 27h14m
        alertname: AgentCapsuleBackupStale
        exp_alerts: []
      - eval_time: 27h18m
        alertname: AgentCapsuleBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1, repo: standby}
            exp_annotations:
              summary: A backup repository has no base backup that finished in the last 26 hours.
      - eval_time: 11h14m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts: []
      - eval_time: 11h16m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1}
            exp_annotations:
              summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).
      - eval_time: 20h28m
        alertname: AgentCapsuleBackupRepositoryUnreadable
        exp_alerts: []
      - eval_time: 20h32m
        alertname: AgentCapsuleBackupRepositoryUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-2, repo: standby}
            exp_annotations:
              summary: pgBackRest cannot read a backup repository; its backups cannot be checked.

  # A full backup at 01:00 and none since; no collection at all.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="full"}'
        values: '3600x11700'
    alert_rule_test:
      - eval_time: 14m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).
      - eval_time: 193h14m
        alertname: AgentCapsuleFullBackupStale
        exp_alerts: []
      - eval_time: 193h18m
        alertname: AgentCapsuleFullBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1, repo: s3, type: full}
            exp_annotations:
              summary: A backup repository has no full backup that finished in the last 8 days.

  # The oldest of the host's newest volume archives grows past 26 hours; on
  # another host, a capture resets it in time.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_volume_archive_oldest_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '93000 93600+60x30'
      - series: 'agentcapsule_worker_volume_archive_oldest_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '93000 93600+60x5 0+60x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: AgentCapsuleVolumeArchiveStale
        exp_alerts: []
      - eval_time: 18m
        alertname: AgentCapsuleVolumeArchiveStale
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: An agent of this host has no volume archive from the last 26 hours.

  # ADR 018: host-1's oldest unfinished deletion passes 6 hours at 11m and
  # stays; host-2's passes them too, then finishes at 15m, before the
  # alert's 15 minutes.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_deletion_oldest_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '21000+60x40'
      - series: 'agentcapsule_worker_deletion_oldest_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '21000+60x14 0x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: AgentCapsuleDeletionUnfinished
        exp_alerts: []
      - eval_time: 27m
        alertname: AgentCapsuleDeletionUnfinished
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: An agent's deletion on this host has not finished for 6 hours; its volume key still exists.

  # Volume archives off the host. host-1: the S3 store last received every
  # archive at 01:00, the standby every hour; the shipper writes hourly until
  # 03:00, then stops. host-2: the standby's store cannot be listed from
  # 10:00. host-3: an archive shipped to S3 changes on the host at 05:00.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_archive_ship_last_success_timestamp_seconds{job="node",instance="host-1",store="s3"}'
        values: '3600x400'
      - series: 'agentcapsule_archive_ship_last_success_timestamp_seconds{job="node",instance="host-1",store="standby"}'
        values: '0x59 3600x59 7200x59 10800x59 14400x59 18000x59 21600x59'
      - series: 'agentcapsule_archive_ship_collected_timestamp_seconds{job="node",instance="host-1"}'
        values: '0x59 3600x59 7200x59 10800x300'
      - series: 'agentcapsule_archive_ship_store_readable{job="node",instance="host-2",store="s3"}'
        values: '1x800'
      - series: 'agentcapsule_archive_ship_store_readable{job="node",instance="host-2",store="standby"}'
        values: '1x599 0x200'
      - series: 'agentcapsule_archive_ship_changed_archives{job="node",instance="host-3",store="s3"}'
        values: '0x299 1x100'
      - series: 'agentcapsule_archive_ship_changed_archives{job="node",instance="host-3",store="standby"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 3h15m
        alertname: AgentCapsuleArchiveShipBehind
        exp_alerts: []
      - eval_time: 3h17m
        alertname: AgentCapsuleArchiveShipBehind
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1, store: s3}
            exp_annotations:
              summary: A store has lacked some of this host's volume archives for 2 hours.
      - eval_time: 11h29m
        alertname: AgentCapsuleArchiveStoreUnreadable
        exp_alerts: []
      - eval_time: 11h31m
        alertname: AgentCapsuleArchiveStoreUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-2, store: standby}
            exp_annotations:
              summary: The volume archive shipper could not list a store, at two runs in a row.
      - eval_time: 4h59m
        alertname: AgentCapsuleArchiveChanged
        exp_alerts: []
      - eval_time: 5h1m
        alertname: AgentCapsuleArchiveChanged
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: host-3, store: s3}
            exp_annotations:
              summary: A volume archive changed on this host after it was shipped; the store keeps the copy it received.
      - eval_time: 6h15m
        alertname: AgentCapsuleArchiveShipMetricsStale
        exp_alerts: []
      - eval_time: 6h17m
        alertname: AgentCapsuleArchiveShipMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1}
            exp_annotations:
              summary: The volume archive shipper has not run for 3 hours, or never ran (agentcapsule-archive-ship.timer or node_exporter's textfile collector).

  # Neither the shipper nor the standby's collection ever ran.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="host-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: AgentCapsuleArchiveShipMetricsStale
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleArchiveShipMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: The volume archive shipper has not run for 3 hours, or never ran (agentcapsule-archive-ship.timer or node_exporter's textfile collector).
      - eval_time: 4m
        alertname: AgentCapsuleStandbyMetricsStale
        exp_alerts: []
      - eval_time: 6m
        alertname: AgentCapsuleStandbyMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: The standby's replay has not been collected for 10 minutes, or never was (agentcapsule-standby-metrics.timer or node_exporter's textfile collector).

  # The standby; replay times are the commit times on the test's clock, which
  # a heartbeat keeps current. standby-1: the replay stops at 00:30 while the
  # collection goes on. standby-2: promoted at 00:10, so its replay stops too,
  # without the replay alert. standby-3: PostgreSQL stops answering at 00:20.
  # standby-4: the collection itself stops at 00:30.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_standby_in_recovery{job="node",instance="standby-1"}'
        values: '1x80'
      - series: 'agentcapsule_standby_replay_timestamp_seconds{job="node",instance="standby-1"}'
        values: '0+60x30 1800x50'
      - series: 'agentcapsule_standby_postgres_up{job="node",instance="standby-1"}'
        values: '1x80'
      - series: 'agentcapsule_standby_collected_timestamp_seconds{job="node",instance="standby-1"}'
        values: '0+60x80'
      - series: 'agentcapsule_standby_in_recovery{job="node",instance="standby-2"}'
        values: '1x9 0x70'
      - series: 'agentcapsule_standby_replay_timestamp_seconds{job="node",instance="standby-2"}'
        values: '0+60x9 540x70'
      - series: 'agentcapsule_standby_postgres_up{job="node",instance="standby-2"}'
        values: '1x80'
      - series: 'agentcapsule_standby_collected_timestamp_seconds{job="node",instance="standby-2"}'
        values: '0+60x80'
      - series: 'agentcapsule_standby_in_recovery{job="node",instance="standby-3"}'
        values: '1x19'
      - series: 'agentcapsule_standby_replay_timestamp_seconds{job="node",instance="standby-3"}'
        values: '0+60x19'
      - series: 'agentcapsule_standby_postgres_up{job="node",instance="standby-3"}'
        values: '1x19 0x60'
      - series: 'agentcapsule_standby_collected_timestamp_seconds{job="node",instance="standby-3"}'
        values: '0+60x80'
      - series: 'agentcapsule_standby_in_recovery{job="node",instance="standby-4"}'
        values: '1x80'
      - series: 'agentcapsule_standby_replay_timestamp_seconds{job="node",instance="standby-4"}'
        values: '0+60x30 1800x50'
      - series: 'agentcapsule_standby_postgres_up{job="node",instance="standby-4"}'
        values: '1x80'
      - series: 'agentcapsule_standby_collected_timestamp_seconds{job="node",instance="standby-4"}'
        values: '0+60x30 1800x50'
    alert_rule_test:
      - eval_time: 47m
        alertname: AgentCapsuleStandbyReplayBehind
        exp_alerts: []
      - eval_time: 49m
        alertname: AgentCapsuleStandbyReplayBehind
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: standby-1}
            exp_annotations:
              summary: The standby has replayed no transaction committed in the last 15 minutes; it is behind the database's RPO.
          - exp_labels: {severity: critical, job: node, instance: standby-4}
            exp_annotations:
              summary: The standby has replayed no transaction committed in the last 15 minutes; it is behind the database's RPO.
      - eval_time: 14m
        alertname: AgentCapsuleStandbyNotInRecovery
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleStandbyNotInRecovery
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: standby-2}
            exp_annotations:
              summary: The standby's PostgreSQL is not in recovery; it was promoted or started as a primary, and no longer follows the archive.
      - eval_time: 24m
        alertname: AgentCapsuleStandbyDown
        exp_alerts: []
      - eval_time: 26m
        alertname: AgentCapsuleStandbyDown
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: standby-3}
            exp_annotations:
              summary: The standby's PostgreSQL does not answer; it cannot take over.
      - eval_time: 45m
        alertname: AgentCapsuleStandbyMetricsStale
        exp_alerts: []
      - eval_time: 47m
        alertname: AgentCapsuleStandbyMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: standby-4}
            exp_annotations:
              summary: The standby's replay has not been collected for 10 minutes, or never was (agentcapsule-standby-metrics.timer or node_exporter's textfile collector).

  # The authorities' replica (D-05), from the authority service. host-1: the
  # standby stops at 00:05, degraded mode from 00:06 to 00:20, attempts fail
  # every second until the standby returns at 00:20, and a seal gives up at
  # 00:08. host-2: a service restarted without its standby; its attempts fail
  # and degraded mode never begins. host-3: one failed attempt at 00:03, then
  # nothing.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_authority_replication_degraded_since_timestamp_seconds{job="agentcapsule-authority",instance="host-1"}'
        values: '0x5 360x14 0x10'
      - series: 'agentcapsule_authority_replication_errors_total{job="agentcapsule-authority",instance="host-1",kind="unreachable"}'
        values: '0x4 1+60x15 901x10'
      - series: 'agentcapsule_authority_replication_degraded_refused_total{job="agentcapsule-authority",instance="host-1",kind="seal"}'
        values: '0x7 1x22'
      - series: 'agentcapsule_authority_replication_degraded_since_timestamp_seconds{job="agentcapsule-authority",instance="host-2"}'
        values: '0x30'
      - series: 'agentcapsule_authority_replication_errors_total{job="agentcapsule-authority",instance="host-2",kind="unreachable"}'
        values: '0+60x30'
      - series: 'agentcapsule_authority_replication_degraded_since_timestamp_seconds{job="agentcapsule-authority",instance="host-3"}'
        values: '0x30'
      - series: 'agentcapsule_authority_replication_errors_total{job="agentcapsule-authority",instance="host-3",kind="timeout"}'
        values: '0x2 1x27'
    alert_rule_test:
      - eval_time: 6m
        alertname: AgentCapsuleAuthorityDegraded
        exp_alerts: []
      - eval_time: 8m
        alertname: AgentCapsuleAuthorityDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-authority, instance: host-1}
            exp_annotations:
              summary: The authority service runs in degraded mode without the standby; creating, deleting and restoring agents wait, and losing this host would lose the outcomes recorded since.
      - eval_time: 22m
        alertname: AgentCapsuleAuthorityDegraded
        exp_alerts: []
      - eval_time: 7m
        alertname: AgentCapsuleAuthorityOperationsRefused
        exp_alerts: []
      - eval_time: 9m
        alertname: AgentCapsuleAuthorityOperationsRefused
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-authority, instance: host-1, kind: seal}
            exp_annotations:
              summary: Authority operations gave up waiting for the standby in degraded mode; creating, deleting or restoring agents fails until it returns.
      - eval_time: 25m
        alertname: AgentCapsuleAuthorityOperationsRefused
        exp_alerts: []
      - eval_time: 5m
        alertname: AgentCapsuleAuthorityReplicationStopped
        exp_alerts: []
      - eval_time: 12m
        alertname: AgentCapsuleAuthorityReplicationStopped
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-authority, instance: host-2}
            exp_annotations:
              summary: The authority service keeps failing to reach the replica outside degraded mode; every authority operation waits or fails.
      - eval_time: 28m
        alertname: AgentCapsuleAuthorityReplicationStopped
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-authority, instance: host-2}
            exp_annotations:
              summary: The authority service keeps failing to reach the replica outside degraded mode; every authority operation waits or fails.

  # The authority service (ADR 006). host-1's service stops answering at
  # 00:03 and is back at 00:10; host-2's misses one scrape at 00:04. The
  # API's and the worker's AgentCapsuleTargetDown does not fire for it.
  - interval: 1m
    input_series:
      - series: 'up{job="agentcapsule-authority",instance="host-1"}'
        values: '1x2 0x6 1x5'
      - series: 'up{job="agentcapsule-authority",instance="host-2"}'
        values: '1x3 0 1x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: AgentCapsuleAuthorityServiceDown
        exp_alerts: []
      - eval_time: 6m
        alertname: AgentCapsuleAuthorityServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-authority, instance: host-1}
            exp_annotations:
              summary: The authority service does not answer its metrics scrape; no agent boots and authority operations fail until it returns.
      - eval_time: 6m
        alertname: AgentCapsuleTargetDown
        exp_alerts: []
      - eval_time: 12m
        alertname: AgentCapsuleAuthorityServiceDown
        exp_alerts: []

  # The API's server errors, failing jobs, a full host, the wake budget and
  # the metrics' own collection. On host-1 each condition starts at about
  # minute 6 and lasts; on host-2 each stays below its threshold or does not
  # last.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_api_requests_total{job="agentcapsule-api",instance="host-1",route="/v1/agents",method="POST",status_class="2xx"}'
        values: '0+100x40'
      - series: 'agentcapsule_api_requests_total{job="agentcapsule-api",instance="host-1",route="/v1/agents",method="POST",status_class="5xx"}'
        values: '0x5 0+10x35'
      - series: 'agentcapsule_api_requests_total{job="agentcapsule-api",instance="host-2",route="/v1/agents",method="POST",status_class="2xx"}'
        values: '0+100x40'
      - series: 'agentcapsule_api_requests_total{job="agentcapsule-api",instance="host-2",route="/v1/agents",method="POST",status_class="5xx"}'
        values: '0+1x40'
      - series: 'agentcapsule_worker_jobs_failing{job="agentcapsule-worker",instance="host-1",kind="delivery"}'
        values: '0x5 2x35'
      - series: 'agentcapsule_worker_jobs_failing{job="agentcapsule-worker",instance="host-2",kind="closure"}'
        values: '0x5 1x5 0x30'
      - series: 'agentcapsule_worker_vm_capacity{job="agentcapsule-worker",instance="host-1"}'
        values: '4x40'
      - series: 'agentcapsule_worker_vms_running{job="agentcapsule-worker",instance="host-1"}'
        values: '2x5 4x35'
      - series: 'agentcapsule_worker_vm_capacity{job="agentcapsule-worker",instance="host-2"}'
        values: '4x40'
      - series: 'agentcapsule_worker_vms_running{job="agentcapsule-worker",instance="host-2"}'
        values: '3x40'
      - series: 'agentcapsule_worker_job_retries_total{job="agentcapsule-worker",instance="host-1",kind="delivery",reason="wake_budget"}'
        values: '0x5 1x35'
      - series: 'agentcapsule_worker_job_retries_total{job="agentcapsule-worker",instance="host-2",kind="delivery",reason="capacity"}'
        values: '0+1x40'
      - series: 'agentcapsule_telemetry_collect_errors_total{job="agentcapsule-worker",instance="host-1"}'
        values: '0x5 0+1x35'
      - series: 'agentcapsule_telemetry_collect_errors_total{job="agentcapsule-worker",instance="host-2"}'
        values: '0x5 1x35'
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentCapsuleAPIServerErrors
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleAPIServerErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-api, instance: host-1}
            exp_annotations:
              summary: More than 5 % of API requests fail with a server error.
      - eval_time: 15m
        alertname: AgentCapsuleJobsFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleJobsFailing
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: delivery}
            exp_annotations:
              summary: Worker jobs keep failing (three attempts or more).
      - eval_time: 15m
        alertname: AgentCapsuleCapacityExhausted
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleCapacityExhausted
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The host runs as many VMs as max_active allows; new work stops an idle VM or waits.
      - eval_time: 4m
        alertname: AgentCapsuleWakeBudgetExhausted
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentCapsuleWakeBudgetExhausted
        exp_alerts:
          - exp_labels: {severity: info, job: agentcapsule-worker, instance: host-1, kind: delivery, reason: wake_budget}
            exp_annotations:
              summary: An organization's agents reached their wake budget; requests wait.
      - eval_time: 30m
        alertname: AgentCapsuleWakeBudgetExhausted
        exp_alerts: []
      - eval_time: 12m
        alertname: AgentCapsuleMetricsStale
        exp_alerts: []
      - eval_time: 25m
        alertname: AgentCapsuleMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: A process cannot read its current state for its metrics (database or disk).

  # The daily receipt keys (ADR 006 wave 6). host-1 holds no key of the day
  # from 00:02 to 00:10; host-2 lacks tomorrow's key until 01:31; host-3
  # keeps an expired key from 00:10 to 01:20.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_authority_receipt_key_ready{job="agentcapsule-authority",instance="host-1",day="today"}'
        values: '1x1 0x8 1x80'
      - series: 'agentcapsule_authority_receipt_key_ready{job="agentcapsule-authority",instance="host-1",day="tomorrow"}'
        values: '1x100'
      - series: 'agentcapsule_authority_receipt_key_ready{job="agentcapsule-authority",instance="host-2",day="today"}'
        values: '1x100'
      - series: 'agentcapsule_authority_receipt_key_ready{job="agentcapsule-authority",instance="host-2",day="tomorrow"}'
        values: '0x90 1x10'
      - series: 'agentcapsule_authority_receipt_keys_overdue{job="agentcapsule-authority",instance="host-3"}'
        values: '0x9 1x70 0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: AgentCapsuleReceiptKeyMissing
        exp_alerts: []
      - eval_time: 8m
        alertname: AgentCapsuleReceiptKeyMissing
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-authority, instance: host-1, day: today}
            exp_annotations:
              summary: The authority service holds no receipt key of the day; the API refuses every request that takes an idempotency key.
      - eval_time: 12m
        alertname: AgentCapsuleReceiptKeyMissing
        exp_alerts: []
      - eval_time: 50m
        alertname: AgentCapsuleNextReceiptKeyMissing
        exp_alerts: []
      - eval_time: 75m
        alertname: AgentCapsuleNextReceiptKeyMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-authority, instance: host-2, day: tomorrow}
            exp_annotations:
              summary: Tomorrow's receipt key is missing; if the standby does not return by midnight UTC, the next day's key will be created on the primary alone.
      - eval_time: 95m
        alertname: AgentCapsuleNextReceiptKeyMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: AgentCapsuleReceiptKeyNotDestroyed
        exp_alerts: []
      - eval_time: 75m
        alertname: AgentCapsuleReceiptKeyNotDestroyed
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-authority, instance: host-3}
            exp_annotations:
              summary: A daily receipt key outlives its destruction time; its destruction waits for the standby or fails, and backups of its day stay readable.
      - eval_time: 85m
        alertname: AgentCapsuleReceiptKeyNotDestroyed
        exp_alerts: []
