# promtool test rules alerts_test.yml (scripts/verify-alerts.py runs it).
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_root_disk_used_ratio{job="agentcapsule-worker",instance="host-1"}'
        values: '0.50 0.75x20 0.85x10'
      - series: 'agentcapsule_worker_job_oldest_due_seconds{job="agentcapsule-worker",instance="host-1",kind="delivery"}'
        values: '0 400x10'
      - series: 'up{job="agentcapsule-api",instance="host-1"}'
        values: '1 0x5'
      - series: 'agentcapsule_worker_job_retries_total{job="agentcapsule-worker",instance="host-1",kind="delivery",reason="slim_unavailable"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AgentCapsuleDiskPressure
        exp_alerts: []
      - eval_time: 15m
        alertname: AgentCapsuleDiskPressure
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The runtime root's file system is more than 70 % full.
      - eval_time: 15m
        alertname: AgentCapsuleDiskCritical
        exp_alerts: []
      - eval_time: 28m
        alertname: AgentCapsuleDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: The runtime root's file system is more than 80 % full.
      - eval_time: 8m
        alertname: AgentCapsuleQueueDelayed
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: delivery}
            exp_annotations:
              summary: A due worker job has waited more than 5 minutes past its time.
      - eval_time: 4m
        alertname: AgentCapsuleTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-api, instance: host-1}
            exp_annotations:
              summary: An Agent Capsule process does not answer its metrics scrape.
      - eval_time: 25m
        alertname: AgentCapsuleSLIMUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1, kind: delivery, reason: slim_unavailable}
            exp_annotations:
              summary: Deliveries between agents wait for the SLIM bridge or node.

  # WAL archiving (REC-03). host-1: archiving stuck from the start, failing
  # from minute 6. host-2: an idle database, archived an hour ago, nothing
  # waiting. host-3: archive_mode turned off at minute 10. host-4:
  # archive_timeout above the RPO.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-1"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archive_age_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '0+60x40'
      - series: 'agentcapsule_postgres_wal_archive_pending{job="agentcapsule-worker",instance="host-1"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_failing{job="agentcapsule-worker",instance="host-1"}'
        values: '0x5 1x34'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-2"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archive_age_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '3600+60x40'
      - series: 'agentcapsule_postgres_wal_archive_pending{job="agentcapsule-worker",instance="host-2"}'
        values: '0x40'
      - series: 'agentcapsule_postgres_wal_archive_failing{job="agentcapsule-worker",instance="host-2"}'
        values: '0x40'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-3"}'
        values: '1x9 0x30'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-3"}'
        values: '300x40'
      - series: 'agentcapsule_postgres_wal_archiving_enabled{job="agentcapsule-worker",instance="host-4"}'
        values: '1x40'
      - series: 'agentcapsule_postgres_wal_archive_timeout_seconds{job="agentcapsule-worker",instance="host-4"}'
        values: '1200x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts: []
      - eval_time: 14m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-4}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
      - eval_time: 16m
        alertname: AgentCapsuleWALArchivingMisconfigured
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-3}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-4}
            exp_annotations:
              summary: PostgreSQL does not archive its WAL within the 15-minute RPO (archive_mode, archive_command or archive_timeout).
      - eval_time: 10m
        alertname: AgentCapsuleWALArchiveFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: AgentCapsuleWALArchiveFailing
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: PostgreSQL's WAL archiving keeps failing; the database's 15-minute RPO is at risk.
      - eval_time: 17m
        alertname: AgentCapsuleWALArchiveStale
        exp_alerts: []
      - eval_time: 19m
        alertname: AgentCapsuleWALArchiveStale
        exp_alerts:
          - exp_labels: {severity: critical, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: No WAL archived for 15 minutes while a completed segment waits; the database's RPO is breached.
      - eval_time: 14m
        alertname: AgentCapsuleWALArchiveBacklog
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleWALArchiveBacklog
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: Completed WAL segments have waited for archiving for 15 minutes; archiving does not keep up.

  # Base backups, from the textfile; times are seconds since the test's start.
  # host-1: a full backup into each repository at 01:00, a differential into
  # S3 only the next night, and the collection stops after 10 hours. host-2:
  # the standby's repository becomes unreadable at 20:00.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="full"}'
        values: '3600x1800'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="diff"}'
        values: '0x1499 90000x300'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="standby",type="full"}'
        values: '3600x1800'
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="standby",type="diff"}'
        values: '0x1800'
      - series: 'agentcapsule_backup_collected_timestamp_seconds{job="node",instance="host-1"}'
        values: '0+60x599 35940x1200'
      - series: 'agentcapsule_backup_repository_readable{job="node",instance="host-2",repo="s3"}'
        values: '1x1800'
      - series: 'agentcapsule_backup_repository_readable{job="node",instance="host-2",repo="standby"}'
        values: '1x1199 0x600'
    alert_rule_test:
      - eval_time: 27h14m
        alertname: AgentCapsuleBackupStale
        exp_alerts: []
      - eval_time: 27h18m
        alertname: AgentCapsuleBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1, repo: standby}
            exp_annotations:
              summary: A backup repository has no base backup that finished in the last 26 hours.
      - eval_time: 11h14m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts: []
      - eval_time: 11h16m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1}
            exp_annotations:
              summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).
      - eval_time: 20h28m
        alertname: AgentCapsuleBackupRepositoryUnreadable
        exp_alerts: []
      - eval_time: 20h32m
        alertname: AgentCapsuleBackupRepositoryUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-2, repo: standby}
            exp_annotations:
              summary: pgBackRest cannot read a backup repository; its backups cannot be checked.

  # A full backup at 01:00 and none since; no collection at all.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_backup_last_success_timestamp_seconds{job="node",instance="host-1",repo="s3",type="full"}'
        values: '3600x11700'
    alert_rule_test:
      - eval_time: 14m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts: []
      - eval_time: 16m
        alertname: AgentCapsuleBackupMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Backup freshness has not been collected for an hour (agentcapsule-backup-metrics.timer or node_exporter's textfile collector).
      - eval_time: 193h14m
        alertname: AgentCapsuleFullBackupStale
        exp_alerts: []
      - eval_time: 193h18m
        alertname: AgentCapsuleFullBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: host-1, repo: s3, type: full}
            exp_annotations:
              summary: A backup repository has no full backup that finished in the last 8 days.

  # The oldest of the host's newest volume archives grows past 26 hours; on
  # another host, a capture resets it in time.
  - interval: 1m
    input_series:
      - series: 'agentcapsule_worker_volume_archive_oldest_seconds{job="agentcapsule-worker",instance="host-1"}'
        values: '93000 93600+60x30'
      - series: 'agentcapsule_worker_volume_archive_oldest_seconds{job="agentcapsule-worker",instance="host-2"}'
        values: '93000 93600+60x5 0+60x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: AgentCapsuleVolumeArchiveStale
        exp_alerts: []
      - eval_time: 18m
        alertname: AgentCapsuleVolumeArchiveStale
        exp_alerts:
          - exp_labels: {severity: warning, job: agentcapsule-worker, instance: host-1}
            exp_annotations:
              summary: An agent of this host has no volume archive from the last 26 hours.
