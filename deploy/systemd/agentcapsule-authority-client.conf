# A drop-in for the units of the worker and of the API, which reach the
# authority service: install as
#   /etc/systemd/system/agentcapsule-worker.service.d/authority.conf
#   /etc/systemd/system/agentcapsule-api.service.d/authority.conf
# They start after the service, and start it, but do not stop or restart with
# it (no Requires=): a worker that starts before the service answers waits
# for it, and keeps its VMs while the service restarts.
[Unit]
Wants=agentcapsule-authority.service
After=agentcapsule-authority.service
